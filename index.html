<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="description" content="アニメ作品を5項目で採点して記録する個人用メモアプリ">
<title>アニメ採点メモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d14;
  --bg-glow:#1b2033;
  --panel:#151827;
  --panel-2:#1d2133;
  --line:#2b3149;
  --text:#eceef6;
  --dim:#8b93ab;
  --gold:#f0c260;
  --silver:#c2c9db;
  --bronze:#d18f5c;
  --accent:#5fd8c4;
  --accent-dim:#2f6b62;
  --warn:#e8736a;
  --purple:#9b8cf0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1100px 520px at 50% -12%, var(--bg-glow) 0%, var(--bg) 58%),
    var(--bg);
  color:var(--text);
  font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-bottom:104px;
}
button,input,select,textarea{font-family:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ---------- header ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(11,13,20,.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:13px 14px 11px;
}
.brand{display:flex;align-items:flex-end;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.brand h1{
  font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:18.5px;
  margin:0;letter-spacing:.01em;
  background:linear-gradient(92deg,var(--accent),#dff8f3 55%,var(--purple));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand .count{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--dim);}
.tools{display:flex;gap:7px;align-items:center;}
.search{
  flex:1 1 auto;min-width:0;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;font-size:14px;
}
.search::placeholder{color:var(--dim);}
select.sortsel{
  flex:0 0 auto;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:9px 6px;font-size:12.5px;max-width:100px;
}
.sortdir{
  flex:0 0 auto;width:38px;height:38px;background:var(--panel);border:1px solid var(--line);
  color:var(--accent);border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;
}
.sortdir:active{border-color:var(--accent);}
.iconbtn{
  flex:0 0 auto;width:38px;height:38px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;font-size:16px;color:var(--text);cursor:pointer;
}
.iconbtn:active{border-color:var(--accent);}

/* ---------- list ---------- */
.list{padding:9px 10px;display:flex;flex-direction:column;gap:6px;}
.empty{text-align:center;color:var(--dim);padding:64px 22px;font-size:13.5px;line-height:1.9;}
.empty b{display:block;font-family:'Zen Maru Gothic',sans-serif;font-size:15px;color:var(--text);margin-bottom:6px;font-weight:700;}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;transition:border-color .16s ease,background .16s ease;
}
.card.open{border-color:var(--accent-dim);background:var(--panel-2);}
.head{display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer;user-select:none;}
.rank{
  flex:0 0 auto;width:26px;text-align:center;font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;font-weight:600;color:var(--dim);
}
.rank.r1{font-size:14px;}
.rank.r2{font-size:14px;}
.rank.r3{font-size:14px;}
.mid{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px;}
.title{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.date{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.01em;}
.total{
  flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;color:var(--accent);
}
.total small{font-size:10px;color:var(--dim);margin-left:2px;}
.chev{flex:0 0 auto;color:var(--dim);font-size:11px;transition:transform .16s ease;}
.card.open .chev{transform:rotate(180deg);}

.body{display:none;padding:2px 11px 11px;border-top:1px dashed var(--line);}
.card.open .body{display:block;}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:10px 0 9px;}
.cell{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;}
.cell .k{display:block;font-size:9.5px;color:var(--dim);margin-bottom:3px;letter-spacing:.02em;}
.cell .v{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;color:var(--text);word-break:break-all;}
.note{
  font-size:12.5px;line-height:1.75;color:#cdd3e4;background:var(--bg);
  border:1px solid var(--line);border-left:3px solid var(--purple);
  border-radius:8px;padding:8px 10px;margin-bottom:9px;white-space:pre-wrap;word-break:break-word;
}
.rowbtns{display:flex;gap:7px;flex-wrap:wrap;}
.mini{
  border:1px solid var(--line);background:var(--bg);color:var(--text);
  border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;text-decoration:none;display:inline-block;
}
.mini:active{border-color:var(--accent);}
.mini.link{color:var(--accent);}
.mini.del{color:var(--warn);margin-left:auto;}

/* ---------- fab ---------- */
.fab{
  position:fixed;right:16px;bottom:20px;z-index:35;
  width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;
  font-size:27px;line-height:1;font-weight:700;
  background:linear-gradient(145deg,var(--accent),#3fb6a4);color:#04231f;
  box-shadow:0 10px 26px rgba(95,216,196,.3);
}
.fab:active{transform:scale(.95);}
.locked .fab{background:linear-gradient(145deg,#3b4157,#2b3048);color:var(--dim);box-shadow:none;}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,6,11,.72);z-index:40;display:none;}
.scrim.show{display:block;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92vh;overflow-y:auto;
  background:var(--panel);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;padding:16px 15px 26px;
  transform:translateY(102%);transition:transform .24s cubic-bezier(.22,.7,.2,1);
  box-shadow:0 -12px 34px rgba(0,0,0,.5);
}
.sheet.show{transform:translateY(0);}
#dialogsheet{z-index:70;}
.sheet h2{font-family:'Zen Maru Gothic',sans-serif;font-size:16px;font-weight:700;margin:0 0 3px;}
.sheet .hint{font-size:11.5px;color:var(--dim);margin:0 0 14px;line-height:1.7;white-space:pre-wrap;}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 12px;}
label.f{display:block;margin-bottom:11px;}
label.f span{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;}
.inp{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;
  padding:10px 11px;font-size:14px;
}
.inp::placeholder{color:#5f677d;}
textarea.inp{resize:vertical;min-height:62px;font-size:13.5px;line-height:1.7;}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.actrow{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.btn{
  flex:1 1 40%;border:1px solid var(--line);background:var(--bg);border-radius:10px;
  padding:13px 10px;font-size:14px;font-weight:700;cursor:pointer;
}
.btn.primary{background:linear-gradient(145deg,var(--accent),#3fb6a4);color:#04231f;border-color:transparent;}
.btn.ghost{color:var(--dim);}
.btn.warn{color:var(--warn);}
.btn:active{transform:scale(.985);}
.sub{border:none;background:none;color:var(--accent);font-size:12px;padding:0 0 11px;cursor:pointer;text-decoration:underline;}
.menurow{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--line);background:var(--bg);border-radius:10px;
  padding:13px 13px;margin-bottom:8px;font-size:13.5px;cursor:pointer;text-align:left;width:100%;
}
.menurow small{display:block;color:var(--dim);font-size:11px;margin-top:3px;font-weight:400;}
.menurow .arw{color:var(--dim);}
.menurow.warn{color:var(--warn);}
.badge{
  display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;
  border:1px solid var(--accent-dim);color:var(--accent);vertical-align:1px;
}
.badge.off{border-color:var(--line);color:var(--dim);}
.badge.busy{border-color:#4a4470;color:var(--purple);}
.badge.err{border-color:#6a3b36;color:var(--warn);}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:92px;transform:translate(-50%,14px);
  background:#eef1f8;color:#12131a;font-size:12.5px;font-weight:700;
  padding:9px 16px;border-radius:22px;z-index:80;opacity:0;pointer-events:none;
  transition:opacity .18s ease,transform .18s ease;max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0);}
.foot{text-align:center;color:#565d73;font-size:10.5px;line-height:1.8;padding:14px 20px 4px;}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>アニメ採点メモ</h1>
    <span class="count" id="count">0件</span>
    <span class="badge off" id="syncBadge">この端末のみ</span>
    <span class="badge off" id="lockBadge">ロック中</span>
  </div>
  <div class="tools">
    <input id="search" class="search" type="search" placeholder="作品名で検索" autocomplete="off">
    <select id="sortsel" class="sortsel" aria-label="並べ替え">
      <option value="total">合計</option>
      <option value="char">キャラ</option>
      <option value="scenario">シナリオ</option>
      <option value="art">作画</option>
      <option value="tempo">テンポ</option>
      <option value="other">追加点</option>
      <option value="title">作品名</option>
      <option value="order">追加順</option>
    </select>
    <button id="sortdir" class="sortdir" title="昇順 / 降順">↓</button>
    <button id="menubtn" class="iconbtn" title="メニュー">⋯</button>
  </div>
</header>

<main id="list" class="list"></main>
<div class="foot" id="foot"></div>

<button id="addbtn" class="fab" title="作品を追加">＋</button>
<div class="scrim" id="scrim"></div>

<!-- 追加 / 編集シート -->
<section class="sheet" id="formsheet" aria-hidden="true">
  <div class="grab"></div>
  <h2 id="formtitle">作品を追加</h2>
  <p class="hint" id="formhint">点数欄は数字でも言葉でも構いません。自動計算で合計を出せます。</p>
  <label class="f"><span>作品名 <em style="color:var(--warn);font-style:normal">*</em></span>
    <input id="f_title" class="inp" type="text" placeholder="例：〇〇の物語" autocomplete="off"></label>
  <div class="three">
    <label class="f"><span>キャラ</span><input id="f_char" class="inp" type="text" inputmode="decimal"></label>
    <label class="f"><span>シナリオ</span><input id="f_scenario" class="inp" type="text" inputmode="decimal"></label>
    <label class="f"><span>作画</span><input id="f_art" class="inp" type="text" inputmode="decimal"></label>
  </div>
  <div class="three">
    <label class="f"><span>テンポ</span><input id="f_tempo" class="inp" type="text" inputmode="decimal"></label>
    <label class="f"><span>追加点</span><input id="f_other" class="inp" type="text" inputmode="decimal"></label>
    <label class="f"><span>合計 <em style="color:var(--warn);font-style:normal">*</em></span><input id="f_total" class="inp" type="text" inputmode="decimal"></label>
  </div>
  <label class="f"><span>作成日</span><input id="f_createdAt" class="inp" type="date"></label>
  <button class="sub" id="calcbtn" type="button">5項目から合計を自動計算</button>
  <label class="f"><span>備考</span><textarea id="f_note" class="inp" placeholder="感想・メモなど"></textarea></label>
  <label class="f"><span>評価リンク（URL）</span><input id="f_link" class="inp" type="url" placeholder="https://" autocomplete="off"></label>
  <div class="actrow">
    <button class="btn ghost" id="cancelbtn" type="button">やめる</button>
    <button class="btn primary" id="savebtn" type="button">保存</button>
  </div>
</section>

<!-- メニューシート -->
<section class="sheet" id="menusheet" aria-hidden="true">
  <div class="grab"></div>
  <h2>メニュー</h2>
  <p class="hint" id="menuhint">追加・編集・削除にはパスコードが必要です。</p>
  <button class="menurow" id="m_lock" type="button"><span>パスコードを入力して解錠<small>この端末でのみ解錠されます</small></span><span class="arw">›</span></button>
  <button class="menurow" id="m_pass" type="button"><span>パスコードを変更<small>初期値は 1234</small></span><span class="arw">›</span></button>
  <button class="menurow" id="m_export" type="button"><span>バックアップを書き出す（JSON）<small>機種変更や引っ越し用</small></span><span class="arw">›</span></button>
  <button class="menurow" id="m_import" type="button"><span>バックアップを読み込む（JSON）<small>書き出したファイルを選択</small></span><span class="arw">›</span></button>
  <button class="menurow" id="m_csv" type="button"><span>表形式で書き出す（CSV）<small>Excel やスプレッドシート用</small></span><span class="arw">›</span></button>
  <p class="hint" id="cloudhint" style="margin:14px 0 0"></p>
  <div class="actrow"><button class="btn ghost" id="menuclose" type="button">閉じる</button></div>
</section>

<!-- 確認ダイアログ -->
<section class="sheet" id="dialogsheet" aria-hidden="true">
  <div class="grab"></div>
  <h2 id="dialogtitle">確認</h2>
  <p class="hint" id="dialogmsg"></p>
  <div class="actrow" id="dialogbtns"></div>
</section>

<input type="file" id="fileinput" accept=".json,application/json" style="display:none">
<div class="toast" id="toast"></div>

<script>
/* ============================================================================
   アニメ採点メモ
   ----------------------------------------------------------------------------
   ■ 複数の端末で同じ記録を見たいとき（共有モード）の設定
     下の「設定」欄に Firebase の値を入れると、
     スマホ・PC など複数の端末で同じ記録が表示・編集できるようになります。
     空のままにすると、これまで通り「この端末だけ」に保存されます。

   ■ 注意
     このファイルは誰でも中身を読めます。設定値は「鍵」ではありません。
     詳しい手順は別途お渡ししている手順書をご覧ください。
   ==========================================================================*/
const FIREBASE_CONFIG = {
  apiKey: "",             // 例: "AIzaSy..."
  authDomain: "",         // 例: "xxxx.firebaseapp.com"
  databaseURL: "",        // 例: "https://xxxx-default-rtdb.firebaseio.com"
  projectId: "",          // 例: "xxxx"
  appId: ""               // 例: "1:1234:web:abcd"
};
/* 他人に推測されにくい文字列に変えてください（半角英数字とハイフン推奨） */
const DB_ROOM = "animemo-room-change-me";
/* Firebase で「匿名認証」を有効にした場合は true のまま */
const USE_ANONYMOUS_AUTH = true;
/* ==========================================================================*/

(function () {
  'use strict';

  const LS_KEY = 'animemo.entries.v2';
  const LS_OLD = 'animemo.entries.v1';
  const LS_CFG = 'animemo.config.v1';
  const DEFAULT_PASS = '1234';
  const FB_VERSION = '10.13.0';

  const FIELDS = [
    { key: 'char', label: 'キャラ' },
    { key: 'scenario', label: 'シナリオ' },
    { key: 'art', label: '作画' },
    { key: 'tempo', label: 'テンポ' },
    { key: 'other', label: '追加点' }
  ];

  const $ = (s) => document.querySelector(s);
  const listEl = $('#list');
  const countEl = $('#count');
  const lockBadge = $('#lockBadge');
  const syncBadge = $('#syncBadge');
  const footEl = $('#foot');
  const searchEl = $('#search');
  const sortSel = $('#sortsel');
  const sortDirBtn = $('#sortdir');
  const scrim = $('#scrim');
  const formSheet = $('#formsheet');
  const menuSheet = $('#menusheet');
  const dialogSheet = $('#dialogsheet');
  const toastEl = $('#toast');

  const items = new Map();
  let cfg = { pass: DEFAULT_PASS };
  let unlocked = false;
  let editingId = null;
  let sortKey = 'total';
  let sortAsc = false;
  let query = '';
  const openIds = new Set();

  let cloudRef = null;        // Firebase の保存先（未設定なら null）
  let cloudMode = false;
  let syncState = 'local';    // local | connecting | online | error
  let syncDetail = '';

  /* ---------------- 小道具 ---------------- */
  function parseNum(v) {
    if (v === null || v === undefined) return null;
    const s = String(v).trim();
    if (s === '') return null;
    const half = s.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).replace(/[，,\s]/g, '');
    const n = Number(half);
    return Number.isFinite(n) ? n : null;
  }
  function fmtNum(v) {
    if (v === null || v === undefined || v === '') return '—';
    return String(v);
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function uid() {
    return 'e' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
  }
  function todayISO() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function fmtDate(iso) {
    if (!iso) return '';
    const m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String(iso));
    if (!m) return String(iso);
    return m[1] + '/' + m[2].padStart(2, '0') + '/' + m[3].padStart(2, '0');
  }
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('読み込み失敗: ' + src));
      document.head.appendChild(s);
    });
  }
  function norm(x) {
    const o = {};
    o.id = String(x.id || uid());
    o.title = x.title == null ? '' : String(x.title);
    FIELDS.forEach((f) => { o[f.key] = x[f.key] == null ? '' : String(x[f.key]); });
    const t = parseNum(x.total);
    o.total = t === null ? null : t;
    o.note = x.note == null ? '' : String(x.note);
    o.link = x.link == null ? '' : String(x.link);
    o.createdAt = typeof x.createdAt === 'string' ? x.createdAt : '';
    o.order = Number(x.order) || 0;
    return o;
  }

  /* ---------------- 保存（ローカル＝常にキャッシュ / クラウド＝共有） ---------------- */
  function cacheSave() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(Array.from(items.values()))); }
    catch (e) { /* 容量不足などは無視（クラウド側に残る） */ }
  }
  function loadLocal() {
    let arr = null;
    try {
      const raw = localStorage.getItem(LS_KEY) || localStorage.getItem(LS_OLD);
      if (raw) arr = JSON.parse(raw);
    } catch (e) { arr = null; }
    if (!Array.isArray(arr)) arr = [];
    let max = 0;
    arr.forEach((e) => { max = Math.max(max, Number(e.order) || 0); });
    arr.forEach((e) => {
      const n = norm(e);
      if (!n.order) { max += 1; n.order = max; }
      if (!n.createdAt) n.createdAt = '';
      items.set(n.id, n);
    });
  }
  function loadCfg() {
    try {
      const raw = localStorage.getItem(LS_CFG);
      if (raw) cfg = Object.assign(cfg, JSON.parse(raw));
    } catch (e) {}
    if (!cfg.pass) cfg.pass = DEFAULT_PASS;
    if (cfg.dateFilled) cfg.dateFilled = cfg.dateFilled;
  }
  function saveCfg() {
    try { localStorage.setItem(LS_CFG, JSON.stringify(cfg)); } catch (e) {}
  }
  function nextOrder() {
    let max = 0;
    items.forEach((e) => { max = Math.max(max, Number(e.order) || 0); });
    return max + 1;
  }

  /* 1件を保存（追加・更新の両方） */
  function putEntry(entry) {
    items.set(entry.id, entry);
    cacheSave();
    if (cloudMode && cloudRef) {
      cloudRef.child(entry.id).set(entry).catch((err) => {
        toast('共有サーバーへの保存に失敗しました');
        setSync('error', err && err.message ? err.message : '');
      });
    }
    render();
  }
  /* 1件を削除 */
  function dropEntry(id) {
    items.delete(id);
    cacheSave();
    if (cloudMode && cloudRef) {
      cloudRef.child(id).remove().catch((err) => {
        toast('共有サーバーからの削除に失敗しました');
        setSync('error', err && err.message ? err.message : '');
      });
    }
    render();
  }

  /* ---------------- 同期状態の表示 ---------------- */
  function setSync(state, detail) {
    syncState = state;
    syncDetail = detail || '';
    const h = $('#cloudhint');
    if (state === 'online') {
      syncBadge.textContent = '共有中';
      syncBadge.className = 'badge';
      footEl.textContent = '記録は共有サーバーに保存され、どの端末で見ても同じ内容になります';
      if (h) h.textContent = '共有モードで動作中です（部屋名: ' + DB_ROOM + '）。同じ設定の端末では同じ記録が表示されます。';
    } else if (state === 'connecting') {
      syncBadge.textContent = '接続中…';
      syncBadge.className = 'badge busy';
      footEl.textContent = '共有サーバーに接続しています…';
      if (h) h.textContent = '共有サーバーに接続中です…';
    } else if (state === 'error') {
      syncBadge.textContent = '同期エラー';
      syncBadge.className = 'badge err';
      footEl.textContent = '共有サーバーに接続できませんでした。今はこの端末だけに保存されます';
      if (h) h.textContent = '共有サーバーに接続できませんでした。\n' + syncDetail + '\n設定（databaseURL・匿名認証・ルール）をご確認ください。';
    } else {
      syncBadge.textContent = 'この端末のみ';
      syncBadge.className = 'badge off';
      footEl.textContent = '記録はこの端末のブラウザにだけ保存されます（他の端末とは共有されません）';
      if (h) h.textContent = 'いまは「この端末のみ」モードです。共有するには、このファイルの設定欄（FIREBASE_CONFIG / DB_ROOM）を入力してください。';
    }
  }

  /* ---------------- クラウド接続 ---------------- */
  function cloudReady() {
    return !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL);
  }
  async function initCloud() {
    if (!cloudReady()) { setSync('local'); return; }
    setSync('connecting');
    try {
      await loadScript('https://www.gstatic.com/firebasejs/' + FB_VERSION + '/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/' + FB_VERSION + '/firebase-database-compat.js');
      if (USE_ANONYMOUS_AUTH) {
        await loadScript('https://www.gstatic.com/firebasejs/' + FB_VERSION + '/firebase-auth-compat.js');
      }
      const fb = window.firebase;
      if (!fb.apps || !fb.apps.length) fb.initializeApp(FIREBASE_CONFIG);
      if (USE_ANONYMOUS_AUTH && fb.auth) {
        if (!fb.auth().currentUser) {
          try { await fb.auth().signInAnonymously(); }
          catch (err) { throw new Error('匿名認証に失敗しました（Firebase で匿名認証を有効にしてください）'); }
        }
      }
      cloudRef = fb.database().ref('rooms/' + DB_ROOM.replace(/[.#$/\[\]]/g, '_') + '/items');
      const snap = await cloudRef.once('value');
      const localSnapshot = Array.from(items.values());
      items.clear();
      snap.forEach((ch) => { items.set(ch.key, norm(Object.assign({ id: ch.key }, ch.val() || {}))); });
      cloudMode = true;
      cacheSave();
      render();
      setSync('online');
      watchCloud(cloudRef);
      if (!snap.exists() && localSnapshot.length) {
        askUploadLocal(localSnapshot);
      }
    } catch (err) {
      cloudMode = false;
      setSync('error', err && err.message ? err.message : String(err));
    }
  }
  function watchCloud(ref) {
    const apply = (snap) => {
      const e = norm(Object.assign({ id: snap.key }, snap.val() || {}));
      items.set(e.id, e);
      cacheSave();
      render();
    };
    ref.on('child_added', apply);
    ref.on('child_changed', apply);
    ref.on('child_removed', (snap) => {
      items.delete(snap.key);
      cacheSave();
      render();
    });
  }
  async function askUploadLocal(list) {
    const pick = await askChoice({
      title: 'この端末の記録を共有しますか？',
      msg: '共有サーバーはまだ空です。\nこの端末にある ' + list.length + ' 件の記録を共有サーバーにアップロードしますか？\n（アップロード後は、同じ設定の端末すべてで同じ記録が見られます）',
      buttons: [
        { label: 'アップロードする', value: 'yes', kind: 'primary' },
        { label: 'あとで', value: 'no', kind: 'ghost' }
      ]
    });
    if (pick !== 'yes' || !cloudRef) return;
    let ok = 0;
    for (const e of list) {
      try { await cloudRef.child(e.id).set(e); ok += 1; } catch (err) { /* 続行 */ }
    }
    toast(ok + '件を共有サーバーにアップロードしました');
  }

  /* ---------------- 描画 ---------------- */
  function totalOf(e) {
    const n = parseNum(e.total);
    return n === null ? -Infinity : n;
  }
  function all() { return Array.from(items.values()); }
  function visibleEntries() {
    const q = query.trim().toLowerCase();
    let arr = all();
    if (q) arr = arr.filter((e) => String(e.title || '').toLowerCase().includes(q));
    const dir = sortAsc ? 1 : -1;
    arr.sort((a, b) => {
      let av, bv;
      if (sortKey === 'title') return String(a.title || '').localeCompare(String(b.title || ''), 'ja') * dir;
      if (sortKey === 'order') return ((Number(a.order) || 0) - (Number(b.order) || 0)) * dir;
      if (sortKey === 'total') { av = totalOf(a); bv = totalOf(b); }
      else {
        const na = parseNum(a[sortKey]), nb = parseNum(b[sortKey]);
        av = na === null ? -Infinity : na;
        bv = nb === null ? -Infinity : nb;
      }
      if (av === bv) return (Number(a.order) || 0) - (Number(b.order) || 0);
      return (av - bv) * dir;
    });
    return arr;
  }
  function render() {
    const arr = visibleEntries();
    countEl.textContent = (query.trim() ? arr.length + ' / ' : '') + items.size + '件';

    if (!arr.length) {
      listEl.innerHTML = items.size
        ? '<div class="empty"><b>該当なし</b>検索語を変えてみてください。</div>'
        : '<div class="empty"><b>まだ記録がありません</b>右下の ＋ から作品を追加すると、ここに一覧が並びます。</div>';
      return;
    }

    const ranked = all().slice().sort((a, b) => totalOf(b) - totalOf(a));
    const medal = new Map();
    ranked.slice(0, 3).forEach((e, i) => medal.set(e.id, i + 1));

    listEl.innerHTML = arr.map((e) => {
      const open = openIds.has(e.id);
      const m = medal.get(e.id);
      const mark = m ? (m === 1 ? '🥇' : m === 2 ? '🥈' : '🥉') : '–';
      const cells = FIELDS.map((f) =>
        '<div class="cell"><span class="k">' + esc(f.label) + '</span><span class="v">' + esc(fmtNum(e[f.key])) + '</span></div>'
      ).join('');
      const link = String(e.link || '').trim();
      const linkHtml = link
        ? '<a class="mini link" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">評価リンクを開く</a>'
        : '';
      const noteHtml = String(e.note || '').trim() ? '<div class="note">' + esc(e.note) + '</div>' : '';
      const dateTxt = e.createdAt ? '作成日 ' + fmtDate(e.createdAt) : '作成日 未設定';
      return '' +
        '<article class="card' + (open ? ' open' : '') + '" data-id="' + esc(e.id) + '">' +
          '<div class="head" data-act="toggle">' +
            '<span class="rank' + (m ? ' r' + m : '') + '">' + mark + '</span>' +
            '<span class="mid">' +
              '<span class="title">' + esc(e.title) + '</span>' +
              '<span class="date">' + esc(dateTxt) + '</span>' +
            '</span>' +
            '<span class="total">' + esc(fmtNum(e.total)) + '<small>点</small></span>' +
            '<span class="chev">▼</span>' +
          '</div>' +
          '<div class="body">' +
            '<div class="grid">' + cells + '</div>' +
            noteHtml +
            '<div class="rowbtns">' + linkHtml +
              '<button class="mini" data-act="edit">編集</button>' +
              '<button class="mini del" data-act="del">削除</button>' +
            '</div>' +
          '</div>' +
        '</article>';
    }).join('');
  }

  /* ---------------- シート ---------------- */
  function anyOpen() {
    return [formSheet, menuSheet, dialogSheet].some((s) => s.classList.contains('show'));
  }
  function openSheet(el) {
    el.classList.add('show');
    el.setAttribute('aria-hidden', 'false');
    scrim.classList.add('show');
  }
  function closeSheet(el) {
    el.classList.remove('show');
    el.setAttribute('aria-hidden', 'true');
    if (!anyOpen()) scrim.classList.remove('show');
  }
  function closeAllSheets() {
    [formSheet, menuSheet, dialogSheet].forEach((s) => {
      s.classList.remove('show');
      s.setAttribute('aria-hidden', 'true');
    });
    scrim.classList.remove('show');
    editingId = null;
  }

  /* 選択ダイアログ（Promise で結果を受け取る） */
  let dialogResolve = null;
  function askChoice(opts) {
    return new Promise((resolve) => {
      if (dialogResolve) { dialogResolve('cancel'); dialogResolve = null; }
      dialogResolve = resolve;
      $('#dialogtitle').textContent = opts.title || '確認';
      $('#dialogmsg').textContent = opts.msg || '';
      const box = $('#dialogbtns');
      box.innerHTML = '';
      (opts.buttons || []).forEach((b) => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'btn ' + (b.kind || '');
        el.textContent = b.label;
        el.addEventListener('click', () => {
          closeSheet(dialogSheet);
          const r = dialogResolve; dialogResolve = null;
          if (r) r(b.value);
        });
        box.appendChild(el);
      });
      openSheet(dialogSheet);
    });
  }
  function cancelDialog() {
    if (!dialogResolve) return false;
    const r = dialogResolve; dialogResolve = null;
    closeSheet(dialogSheet);
    r('cancel');
    return true;
  }

  function setLockUI() {
    if (unlocked) {
      lockBadge.textContent = '解錠中';
      lockBadge.className = 'badge';
      document.body.classList.remove('locked');
    } else {
      lockBadge.textContent = 'ロック中';
      lockBadge.className = 'badge off';
      document.body.classList.add('locked');
    }
  }
  function requireUnlock() {
    if (unlocked) return true;
    toast('先にメニューから解錠してください');
    return false;
  }

  /* ---------------- フォーム ---------------- */
  function openForm(id) {
    editingId = id || null;
    const e = id ? items.get(id) : null;
    $('#formtitle').textContent = e ? '記録を編集' : '作品を追加';
    $('#formhint').textContent = e
      ? '内容を書き換えて保存してください。'
      : '点数欄は数字でも言葉でも構いません。自動計算で合計を出せます。';
    $('#f_title').value = e ? e.title : '';
    FIELDS.forEach((f) => { $('#f_' + f.key).value = e ? e[f.key] : ''; });
    $('#f_total').value = e && e.total !== null ? e.total : '';
    $('#f_createdAt').value = e && e.createdAt ? e.createdAt : todayISO();
    $('#f_note').value = e ? e.note : '';
    $('#f_link').value = e ? e.link : '';
    openSheet(formSheet);
    setTimeout(() => { try { $('#f_title').focus(); } catch (err) {} }, 240);
  }
  function calcTotal() {
    let sum = 0, any = false;
    FIELDS.forEach((f) => {
      const n = parseNum($('#f_' + f.key).value);
      if (n !== null) { sum += n; any = true; }
    });
    if (!any) { toast('点数が入っていません'); return; }
    const rounded = Math.round(sum * 100) / 100;
    $('#f_total').value = String(rounded);
    toast('合計 ' + rounded + ' を入れました（必要なら調整可）');
  }
  function collect() {
    const o = {
      title: $('#f_title').value.trim(),
      total: parseNum($('#f_total').value.trim()),
      createdAt: $('#f_createdAt').value || '',
      note: $('#f_note').value.trim(),
      link: $('#f_link').value.trim()
    };
    FIELDS.forEach((f) => { o[f.key] = $('#f_' + f.key).value.trim(); });
    return o;
  }
  function applyTo(target, src, keepMeta) {
    target.title = src.title;
    FIELDS.forEach((f) => { target[f.key] = src[f.key]; });
    target.total = src.total;
    target.note = src.note;
    target.link = src.link;
    if (keepMeta) {
      target.createdAt = target.createdAt || src.createdAt;
    } else {
      target.createdAt = src.createdAt;
    }
    return target;
  }

  async function save() {
    const src = collect();
    if (!src.title) { toast('作品名を入力してください'); return; }
    if (src.total === null) { toast('合計点を入力してください'); return; }

    /* --- 編集（既存を更新） --- */
    if (editingId) {
      const e = items.get(editingId);
      if (!e) { closeAllSheets(); return; }
      const payload = applyTo(e, src, false);
      putEntry(payload);
      closeAllSheets();
      toast('更新しました');
      return;
    }

    /* --- 新規：同じ作品名がないか確認 --- */
    const key = src.title.toLowerCase();
    const dup = all().filter((x) => String(x.title || '').trim().toLowerCase() === key);
    if (dup.length) {
      const target = dup.slice().sort((a, b) => (Number(b.order) || 0) - (Number(a.order) || 0))[0];
      const pick = await askChoice({
        title: '同じ作品名があります',
        msg: '「' + src.title + '」は既に登録されています（' + dup.length + '件）。\nどうしますか？\n\n・上書き — 登録済みの記録を今回の内容に置き換えます（作成日と並び順は元のまま）\n・新規作成 — 別の記録としてもう1件追加します',
        buttons: [
          { label: '上書きする', value: 'overwrite', kind: 'primary' },
          { label: '新規作成', value: 'new' },
          { label: 'やめる', value: 'cancel', kind: 'ghost' }
        ]
      });
      if (pick === 'cancel' || pick === 'cancel-direct') return;
      if (pick === 'overwrite') {
        applyTo(target, src, true);
        putEntry(target);
        closeAllSheets();
        toast('「' + target.title + '」を上書きしました');
        return;
      }
    }

    const entry = norm({
      id: uid(),
      title: src.title,
      char: src.char, scenario: src.scenario, art: src.art, tempo: src.tempo, other: src.other,
      total: src.total, note: src.note, link: src.link,
      createdAt: src.createdAt || todayISO(),
      order: nextOrder()
    });
    putEntry(entry);
    closeAllSheets();
    toast('追加しました');
  }

  /* ---------------- 書き出し / 読み込み ---------------- */
  function download(name, text, mime) {
    const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1200);
  }
  function stamp() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }
  function exportJson() {
    download('animemo-' + stamp() + '.json', JSON.stringify(all(), null, 2), 'application/json');
    toast('書き出しました');
  }
  function csvCell(v) {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function exportCsv() {
    const head = ['作品名', '作成日', 'キャラ', 'シナリオ', '作画', 'テンポ', '追加点', '合計', '備考', 'リンク'];
    const rows = visibleEntries().map((e) => [
      e.title, e.createdAt ? fmtDate(e.createdAt) : '',
      e.char, e.scenario, e.art, e.tempo, e.other, e.total, e.note, e.link
    ]);
    const csv = '\uFEFF' + [head].concat(rows).map((r) => r.map(csvCell).join(',')).join('\r\n');
    download('animemo-' + stamp() + '.csv', csv, 'text/csv;charset=utf-8');
    toast('CSVを書き出しました');
  }
  function importJson(file) {
    const fr = new FileReader();
    fr.onload = async () => {
      let clean;
      try {
        const data = JSON.parse(String(fr.result));
        if (!Array.isArray(data)) throw new Error('形式が違います');
        clean = data.filter((x) => x && typeof x === 'object' && x.title).map((x) => {
          const n = norm(x);
          if (!n.createdAt) n.createdAt = '';
          return n;
        });
      } catch (err) {
        toast('読み込めませんでした：' + (err && err.message ? err.message : '不明なエラー'));
        return;
      }
      if (!clean.length) { toast('読み込める記録がありません'); return; }
      const pick = await askChoice({
        title: 'バックアップを読み込みます',
        msg: clean.length + '件のデータです。どう読み込みますか？\n\n・追加する — 今の記録に足します\n・置き換える — 今の記録を消して、この内容にします',
        buttons: [
          { label: '追加する', value: 'merge', kind: 'primary' },
          { label: '置き換える', value: 'replace', kind: 'warn' },
          { label: 'やめる', value: 'cancel', kind: 'ghost' }
        ]
      });
      if (pick === 'cancel' || pick === 'cancel-direct') return;

      if (pick === 'replace') {
        if (cloudMode && cloudRef) {
          try { await cloudRef.remove(); } catch (err) {}
        }
        items.clear();
      }
      let order = nextOrder();
      clean.forEach((e) => {
        if (items.has(e.id)) e.id = uid();
        e.order = order++;
        items.set(e.id, e);
      });
      cacheSave();
      if (cloudMode && cloudRef) {
        for (const e of clean) {
          try { await cloudRef.child(e.id).set(e); } catch (err) {}
        }
      }
      render();
      closeAllSheets();
      toast('読み込みました（' + clean.length + '件）');
    };
    fr.readAsText(file);
  }

  /* ---------------- 作成日の一括設定（初回のみ） ---------------- */
  async function offerDateFill() {
    if (cfg.dateFilled) return;
    const missing = all().filter((e) => !e.createdAt);
    if (!missing.length) { cfg.dateFilled = true; saveCfg(); return; }
    const pick = await askChoice({
      title: '作成日が未設定の記録があります',
      msg: missing.length + '件の記録に作成日が入っていません。\n今日の日付（' + fmtDate(todayISO()) + '）を入れておきますか？\nあとから1件ずつ編集することもできます。',
      buttons: [
        { label: '今日の日付を入れる', value: 'fill', kind: 'primary' },
        { label: 'あとで', value: 'skip', kind: 'ghost' }
      ]
    });
    if (pick === 'fill') {
      const today = todayISO();
      missing.forEach((e) => { e.createdAt = today; putEntry(e); });
      toast(missing.length + '件に作成日を入れました');
    }
    cfg.dateFilled = true;
    saveCfg();
  }

  /* ---------------- イベント ---------------- */
  $('#addbtn').addEventListener('click', () => { if (requireUnlock()) openForm(null); });
  $('#menubtn').addEventListener('click', () => openSheet(menuSheet));
  scrim.addEventListener('click', () => { if (!cancelDialog()) closeAllSheets(); });
  $('#cancelbtn').addEventListener('click', closeAllSheets);
  $('#menuclose').addEventListener('click', closeAllSheets);
  $('#savebtn').addEventListener('click', save);
  $('#calcbtn').addEventListener('click', calcTotal);

  listEl.addEventListener('click', (ev) => {
    const btn = ev.target.closest('[data-act]');
    if (!btn) return;
    const card = ev.target.closest('.card');
    if (!card) return;
    const id = card.getAttribute('data-id');
    const act = btn.getAttribute('data-act');
    if (act === 'toggle') {
      if (openIds.has(id)) openIds.delete(id); else openIds.add(id);
      render();
    } else if (act === 'edit') {
      if (requireUnlock()) openForm(id);
    } else if (act === 'del') {
      if (!requireUnlock()) return;
      const e = items.get(id);
      if (!e) return;
      askChoice({
        title: 'この記録を削除しますか？',
        msg: '「' + e.title + '」を削除します。取り消せません。',
        buttons: [
          { label: '削除する', value: 'yes', kind: 'warn' },
          { label: 'やめる', value: 'no', kind: 'ghost' }
        ]
      }).then((r) => {
        if (r !== 'yes') return;
        dropEntry(id);
        toast('削除しました');
      });
    }
  });

  searchEl.addEventListener('input', () => { query = searchEl.value; render(); });
  sortSel.addEventListener('change', () => { sortKey = sortSel.value; render(); });
  sortDirBtn.addEventListener('click', () => {
    sortAsc = !sortAsc;
    sortDirBtn.textContent = sortAsc ? '↑' : '↓';
    render();
  });

  $('#m_lock').addEventListener('click', () => {
    if (unlocked) { unlocked = false; setLockUI(); closeAllSheets(); toast('ロックしました'); return; }
    const v = window.prompt('パスコードを入力してください');
    if (v === null) return;
    if (v === cfg.pass) { unlocked = true; setLockUI(); closeAllSheets(); toast('解錠しました'); }
    else toast('パスコードが違います');
  });
  $('#m_pass').addEventListener('click', () => {
    const cur = window.prompt('現在のパスコードを入力してください');
    if (cur === null) return;
    if (cur !== cfg.pass) { toast('現在のパスコードが違います'); return; }
    const nv = window.prompt('新しいパスコードを入力してください（1文字以上）');
    if (nv === null) return;
    if (!nv.trim()) { toast('空にはできません'); return; }
    cfg.pass = nv.trim(); saveCfg(); toast('パスコードを変更しました');
  });
  $('#m_export').addEventListener('click', () => { if (requireUnlock()) exportJson(); });
  $('#m_csv').addEventListener('click', exportCsv);
  const fileInput = $('#fileinput');
  $('#m_import').addEventListener('click', () => { if (requireUnlock()) fileInput.click(); });
  fileInput.addEventListener('change', () => {
    if (fileInput.files && fileInput.files[0]) importJson(fileInput.files[0]);
    fileInput.value = '';
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (cancelDialog()) return;
    closeAllSheets();
  });

  /* ---------------- 起動 ---------------- */
  loadCfg();
  loadLocal();
  setLockUI();
  render();
  setSync('local');
  initCloud().then(() => {
    if (syncState !== 'connecting') offerDateFill();
  });
})();

</script>
