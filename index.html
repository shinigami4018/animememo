<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="description" content="アニメ作品を5項目で採点して記録する個人用メモアプリ">
<title>アニメ採点メモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d14;
  --bg-glow:#1b2033;
  --panel:#151827;
  --panel-2:#1d2133;
  --line:#2b3149;
  --text:#eceef6;
  --dim:#8b93ab;
  --gold:#f0c260;
  --silver:#c2c9db;
  --bronze:#d18f5c;
  --accent:#5fd8c4;
  --accent-dim:#2f6b62;
  --warn:#e8736a;
  --purple:#9b8cf0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1100px 520px at 50% -12%, var(--bg-glow) 0%, var(--bg) 58%),
    var(--bg);
  color:var(--text);
  font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-bottom:104px;
}
button,input,select,textarea{font-family:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ---------- header ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(11,13,20,.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:13px 14px 11px;
}
.brand{display:flex;align-items:flex-end;gap:9px;margin-bottom:10px;}
.brand h1{
  font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:18.5px;
  margin:0;letter-spacing:.01em;
  background:linear-gradient(92deg,var(--accent),#dff8f3 55%,var(--purple));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand .count{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--dim);}
.tools{display:flex;gap:7px;align-items:center;}
.search{
  flex:1 1 auto;min-width:0;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;font-size:14px;
}
.search::placeholder{color:var(--dim);}
select.sortsel{
  flex:0 0 auto;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:9px 6px;font-size:12.5px;max-width:100px;
}
.sortdir{
  flex:0 0 auto;width:38px;height:38px;background:var(--panel);border:1px solid var(--line);
  color:var(--accent);border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;
}
.sortdir:active{border-color:var(--accent);}
.iconbtn{
  flex:0 0 auto;width:38px;height:38px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;font-size:16px;color:var(--text);cursor:pointer;
}
.iconbtn:active{border-color:var(--accent);}

/* ---------- list ---------- */
.list{padding:9px 10px;display:flex;flex-direction:column;gap:6px;}
.empty{text-align:center;color:var(--dim);padding:64px 22px;font-size:13.5px;line-height:1.9;}
.empty b{display:block;font-family:'Zen Maru Gothic',sans-serif;font-size:15px;color:var(--text);margin-bottom:6px;font-weight:700;}

.card{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;transition:border-color .16s ease,background .16s ease;
}
.card.open{border-color:var(--accent-dim);background:var(--panel-2);}
.head{
  display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer;user-select:none;
}
.rank{
  flex:0 0 auto;width:26px;text-align:center;font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;font-weight:600;color:var(--dim);
}
.rank.r1{color:var(--gold);font-size:14px;}
.rank.r2{color:var(--silver);font-size:14px;}
.rank.r3{color:var(--bronze);font-size:14px;}
.title{
  flex:1 1 auto;min-width:0;font-size:14.5px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.total{
  flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;color:var(--accent);
}
.total small{font-size:10px;color:var(--dim);margin-left:2px;}
.chev{flex:0 0 auto;color:var(--dim);font-size:11px;transition:transform .16s ease;}
.card.open .chev{transform:rotate(180deg);}

.body{display:none;padding:2px 11px 11px;border-top:1px dashed var(--line);}
.card.open .body{display:block;}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:10px 0 9px;}
.cell{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;}
.cell .k{display:block;font-size:9.5px;color:var(--dim);margin-bottom:3px;letter-spacing:.02em;}
.cell .v{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;color:var(--text);word-break:break-all;}
.note{
  font-size:12.5px;line-height:1.75;color:#cdd3e4;background:var(--bg);
  border:1px solid var(--line);border-left:3px solid var(--purple);
  border-radius:8px;padding:8px 10px;margin-bottom:9px;white-space:pre-wrap;word-break:break-word;
}
.rowbtns{display:flex;gap:7px;flex-wrap:wrap;}
.mini{
  border:1px solid var(--line);background:var(--bg);color:var(--text);
  border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;text-decoration:none;display:inline-block;
}
.mini:active{border-color:var(--accent);}
.mini.link{color:var(--accent);}
.mini.del{color:var(--warn);margin-left:auto;}

/* ---------- fab ---------- */
.fab{
  position:fixed;right:16px;bottom:20px;z-index:35;
  width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;
  font-size:27px;line-height:1;font-weight:700;
  background:linear-gradient(145deg,var(--accent),#3fb6a4);color:#04231f;
  box-shadow:0 10px 26px rgba(95,216,196,.3);
}
.fab:active{transform:scale(.95);}
.locked .fab{background:linear-gradient(145deg,#3b4157,#2b3048);color:var(--dim);box-shadow:none;}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,6,11,.72);z-index:40;display:none;}
.scrim.show{display:block;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92vh;overflow-y:auto;
  background:var(--panel);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;padding:16px 15px 26px;
  transform:translateY(102%);transition:transform .24s cubic-bezier(.22,.7,.2,1);
  box-shadow:0 -12px 34px rgba(0,0,0,.5);
}
.sheet.show{transform:translateY(0);}
.sheet h2{
  font-family:'Zen Maru Gothic',sans-serif;font-size:16px;font-weight:700;margin:0 0 3px;
}
.sheet .hint{font-size:11.5px;color:var(--dim);margin:0 0 14px;line-height:1.7;}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 12px;}
label.f{display:block;margin-bottom:11px;}
label.f span{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;}
.inp{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;
  padding:10px 11px;font-size:14px;
}
.inp::placeholder{color:#5f677d;}
textarea.inp{resize:vertical;min-height:62px;font-size:13.5px;line-height:1.7;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.actrow{display:flex;gap:8px;margin-top:16px;}
.btn{
  flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;
  padding:13px;font-size:14px;font-weight:700;cursor:pointer;
}
.btn.primary{background:linear-gradient(145deg,var(--accent),#3fb6a4);color:#04231f;border-color:transparent;}
.btn.ghost{color:var(--dim);}
.btn.warn{color:var(--warn);}
.btn:active{transform:scale(.985);}
.sub{border:none;background:none;color:var(--accent);font-size:12px;padding:0 0 11px;cursor:pointer;text-decoration:underline;}
.menurow{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--line);background:var(--bg);border-radius:10px;
  padding:13px 13px;margin-bottom:8px;font-size:13.5px;cursor:pointer;text-align:left;width:100%;
}
.menurow small{display:block;color:var(--dim);font-size:11px;margin-top:3px;font-weight:400;}
.menurow .arw{color:var(--dim);}
.menurow.warn{color:var(--warn);}
.badge{
  display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;
  border:1px solid var(--accent-dim);color:var(--accent);margin-left:6px;vertical-align:1px;
}
.badge.off{border-color:var(--line);color:var(--dim);}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:92px;transform:translate(-50%,14px);
  background:#eef1f8;color:#12131a;font-size:12.5px;font-weight:700;
  padding:9px 16px;border-radius:22px;z-index:60;opacity:0;pointer-events:none;
  transition:opacity .18s ease,transform .18s ease;max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0);}
.foot{text-align:center;color:#565d73;font-size:10.5px;line-height:1.8;padding:14px 20px 4px;}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>アニメ採点メモ</h1>
    <span class="count" id="count">0件</span>
    <span class="badge off" id="lockBadge">ロック中</span>
  </div>
  <div class="tools">
    <input id="search" class="search" type="search" placeholder="作品名で検索" autocomplete="off">
    <select id="sortsel" class="sortsel" aria-label="並べ替え">
      <option value="total">合計</option>
      <option value="char">キャラ</option>
      <option value="scenario">シナリオ</option>
      <option value="art">作画</option>
      <option value="tempo">テンポ</option>
      <option value="other">その他</option>
      <option value="title">作品名</option>
      <option value="order">追加順</option>
    </select>
    <button id="sortdir" class="sortdir" title="昇順 / 降順">↓</button>
    <button id="menubtn" class="iconbtn" title="メニュー">⋯</button>
  </div>
</header>

<main id="list" class="list"></main>
<div class="foot">記録はこのブラウザの中にだけ保存されます（外部送信なし）</div>

<button id="addbtn" class="fab" title="作品を追加">＋</button>

<div class="scrim" id="scrim"></div>

<!-- 追加 / 編集シート -->
<section class="sheet" id="formsheet" aria-hidden="true">
  <div class="grab"></div>
  <h2 id="formtitle">作品を追加</h2>
  <p class="hint" id="formhint">点数欄は数字でも言葉でも構いません。自動計算で合計を出せます。</p>
  <label class="f"><span>作品名 <em style="color:var(--warn);font-style:normal">*</em></span>
    <input id="f_title" class="inp" type="text" placeholder="例：〇〇の物語" autocomplete="off"></label>
  <div class="three">
    <label class="f"><span>キャラ</span><input id="f_char" class="inp" type="text" inputmode="decimal"></label>
    <label class="f"><span>シナリオ</span><input id="f_scenario" class="inp" type="text" inputmode="decimal"></label>
    <label class="f"><span>作画</span><input id="f_art" class="inp" type="text" inputmode="decimal"></label>
  </div>
  <div class="three">
    <label class="f"><span>テンポ</span><input id="f_tempo" class="inp" type="text" inputmode="decimal"></label>
    <label class="f"><span>その他</span><input id="f_other" class="inp" type="text" inputmode="decimal"></label>
    <label class="f"><span>合計 <em style="color:var(--warn);font-style:normal">*</em></span><input id="f_total" class="inp" type="text" inputmode="decimal"></label>
  </div>
  <button class="sub" id="calcbtn" type="button">5項目から合計を自動計算</button>
  <label class="f"><span>備考</span><textarea id="f_note" class="inp" placeholder="感想・メモなど"></textarea></label>
  <label class="f"><span>評価リンク（URL）</span><input id="f_link" class="inp" type="url" placeholder="https://" autocomplete="off"></label>
  <div class="actrow">
    <button class="btn ghost" id="cancelbtn" type="button">やめる</button>
    <button class="btn primary" id="savebtn" type="button">保存</button>
  </div>
</section>

<!-- メニューシート -->
<section class="sheet" id="menusheet" aria-hidden="true">
  <div class="grab"></div>
  <h2>メニュー</h2>
  <p class="hint" id="menuhint">追加・編集・削除にはパスコードが必要です。</p>
  <button class="menurow" id="m_lock" type="button"><span>パスコードを入力して解錠<small>このタブ内でのみ解錠されます</small></span><span class="arw">›</span></button>
  <button class="menurow" id="m_pass" type="button"><span>パスコードを変更<small>初期値は 1234</small></span><span class="arw">›</span></button>
  <button class="menurow" id="m_export" type="button"><span>バックアップを書き出す（JSON）<small>機種変更や引っ越し用</small></span><span class="arw">›</span></button>
  <button class="menurow" id="m_import" type="button"><span>バックアップを読み込む（JSON）<small>書き出したファイルを選択</small></span><span class="arw">›</span></button>
  <button class="menurow" id="m_csv" type="button"><span>表形式で書き出す（CSV）<small>Excel やスプレッドシート用</small></span><span class="arw">›</span></button>
  <button class="menurow warn" id="m_clear" type="button"><span>すべての記録を削除<small>取り消せません</small></span><span class="arw">›</span></button>
  <div class="actrow"><button class="btn ghost" id="menuclose" type="button">閉じる</button></div>
</section>

<input type="file" id="fileinput" accept=".json,application/json" style="display:none">
<div class="toast" id="toast"></div>

<script>
/* アニメ採点メモ — オリジナル実装 / データはこのブラウザ内のみ */
(function () {
  'use strict';

  const LS_KEY = 'animemo.entries.v1';
  const LS_CFG = 'animemo.config.v1';
  const DEFAULT_PASS = '1234';

  const FIELDS = [
    { key: 'char', label: 'キャラ' },
    { key: 'scenario', label: 'シナリオ' },
    { key: 'art', label: '作画' },
    { key: 'tempo', label: 'テンポ' },
    { key: 'other', label: 'その他' }
  ];

  let entries = [];
  let cfg = { pass: DEFAULT_PASS };
  let unlocked = false;
  let editingId = null;
  let sortKey = 'total';
  let sortAsc = false;
  let query = '';
  let openIds = new Set();

  const $ = (s) => document.querySelector(s);
  const listEl = $('#list');
  const countEl = $('#count');
  const lockBadge = $('#lockBadge');
  const searchEl = $('#search');
  const sortSel = $('#sortsel');
  const sortDirBtn = $('#sortdir');
  const scrim = $('#scrim');
  const formSheet = $('#formsheet');
  const menuSheet = $('#menusheet');
  const toastEl = $('#toast');

  /* ---------------- helpers ---------------- */
  function parseNum(v) {
    if (v === null || v === undefined) return null;
    const s = String(v).trim();
    if (s === '') return null;
    const n = Number(s.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).replace(/[，,\s]/g, ''));
    return Number.isFinite(n) ? n : null;
  }
  function fmtNum(v) {
    if (v === null || v === undefined || v === '') return '—';
    return String(v);
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function uid() {
    return 'e-' + Date.now().toString(36) + '-' + Math.floor(Math.random() * 1e4).toString(36);
  }
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  /* ---------------- storage ---------------- */
  function load() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      entries = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(entries)) entries = [];
    } catch (e) { entries = []; }
    try {
      const c = localStorage.getItem(LS_CFG);
      if (c) cfg = Object.assign(cfg, JSON.parse(c));
    } catch (e) {}
    if (!cfg.pass) cfg.pass = DEFAULT_PASS;
    // 追加順の補正
    let max = 0;
    entries.forEach((e) => { max = Math.max(max, Number(e.order) || 0); });
    entries.forEach((e) => { if (!e.order) { max += 1; e.order = max; } });
  }
  function persist() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(entries)); }
    catch (e) { toast('保存できませんでした（容量不足の可能性）'); }
  }
  function persistCfg() {
    try { localStorage.setItem(LS_CFG, JSON.stringify(cfg)); } catch (e) {}
  }

  /* ---------------- render ---------------- */
  function totalOf(e) {
    const n = parseNum(e.total);
    return n === null ? -Infinity : n;
  }
  function visibleEntries() {
    const q = query.trim().toLowerCase();
    let arr = entries.slice();
    if (q) arr = arr.filter((e) => String(e.title || '').toLowerCase().includes(q));
    const dir = sortAsc ? 1 : -1;
    arr.sort((a, b) => {
      let av, bv;
      if (sortKey === 'title') {
        av = String(a.title || ''); bv = String(b.title || '');
        return av.localeCompare(bv, 'ja') * dir;
      }
      if (sortKey === 'order') {
        av = Number(a.order) || 0; bv = Number(b.order) || 0;
        return (av - bv) * dir;
      }
      if (sortKey === 'total') { av = totalOf(a); bv = totalOf(b); }
      else {
        const na = parseNum(a[sortKey]); const nb = parseNum(b[sortKey]);
        av = na === null ? -Infinity : na;
        bv = nb === null ? -Infinity : nb;
      }
      if (av === bv) return (Number(a.order) || 0) - (Number(b.order) || 0);
      return (av - bv) * dir;
    });
    return arr;
  }

  function render() {
    const arr = visibleEntries();
    countEl.textContent = (query.trim() ? arr.length + ' / ' : '') + entries.length + '件';

    if (!arr.length) {
      listEl.innerHTML = entries.length
        ? '<div class="empty"><b>該当なし</b>検索語を変えてみてください。</div>'
        : '<div class="empty"><b>まだ記録がありません</b>右下の ＋ から作品を追加すると、ここに一覧が並びます。</div>';
      return;
    }

    // 順位（合計点の上位3件にメダル）
    const ranked = entries.slice().sort((a, b) => totalOf(b) - totalOf(a));
    const medal = new Map();
    ranked.slice(0, 3).forEach((e, i) => medal.set(e.id, i + 1));

    listEl.innerHTML = arr.map((e) => {
      const open = openIds.has(e.id);
      const m = medal.get(e.id);
      const cls = m ? ' r' + m : '';
      const mark = m ? (m === 1 ? '🥇' : m === 2 ? '🥈' : '🥉') : '–';
      const cells = FIELDS.map((f) =>
        '<div class="cell"><span class="k">' + esc(f.label) + '</span><span class="v">' + esc(fmtNum(e[f.key])) + '</span></div>'
      ).join('');
      const link = String(e.link || '').trim();
      const linkHtml = link
        ? '<a class="mini link" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">評価リンクを開く</a>'
        : '';
      const noteHtml = String(e.note || '').trim()
        ? '<div class="note">' + esc(e.note) + '</div>' : '';
      return '' +
        '<article class="card' + (open ? ' open' : '') + '" data-id="' + esc(e.id) + '">' +
          '<div class="head" data-act="toggle">' +
            '<span class="rank' + cls + '">' + mark + '</span>' +
            '<span class="title">' + esc(e.title) + '</span>' +
            '<span class="total">' + esc(fmtNum(e.total)) + '<small>点</small></span>' +
            '<span class="chev">▼</span>' +
          '</div>' +
          '<div class="body">' +
            '<div class="grid">' + cells + '</div>' +
            noteHtml +
            '<div class="rowbtns">' + linkHtml +
              '<button class="mini" data-act="edit">編集</button>' +
              '<button class="mini del" data-act="del">削除</button>' +
            '</div>' +
          '</div>' +
        '</article>';
    }).join('');
  }

  /* ---------------- sheets ---------------- */
  function openSheet(el) {
    scrim.classList.add('show');
    el.classList.add('show');
    el.setAttribute('aria-hidden', 'false');
  }
  function closeSheets() {
    scrim.classList.remove('show');
    [formSheet, menuSheet].forEach((s) => {
      s.classList.remove('show');
      s.setAttribute('aria-hidden', 'true');
    });
    editingId = null;
  }

  function setLockUI() {
    if (unlocked) {
      lockBadge.textContent = '解錠中';
      lockBadge.classList.remove('off');
      document.body.classList.remove('locked');
      $('#menuhint').textContent = '解錠中です。記録の追加・編集・削除ができます。';
    } else {
      lockBadge.textContent = 'ロック中';
      lockBadge.classList.add('off');
      document.body.classList.add('locked');
      $('#menuhint').textContent = '追加・編集・削除にはパスコードが必要です。';
    }
  }

  function requireUnlock() {
    if (unlocked) return true;
    toast('先にメニューから解錠してください');
    return false;
  }

  /* ---------------- form ---------------- */
  function openForm(id) {
    editingId = id || null;
    const e = id ? entries.find((x) => x.id === id) : null;
    $('#formtitle').textContent = e ? '記録を編集' : '作品を追加';
    $('#f_title').value = e ? (e.title || '') : '';
    FIELDS.forEach((f) => { $('#f_' + f.key).value = e ? (e[f.key] == null ? '' : e[f.key]) : ''; });
    $('#f_total').value = e ? (e.total == null ? '' : e.total) : '';
    $('#f_note').value = e ? (e.note || '') : '';
    $('#f_link').value = e ? (e.link || '') : '';
    openSheet(formSheet);
    setTimeout(() => $('#f_title').focus(), 240);
  }

  function calcTotal() {
    let sum = 0; let any = false;
    FIELDS.forEach((f) => {
      const n = parseNum($('#f_' + f.key).value);
      if (n !== null) { sum += n; any = true; }
    });
    if (!any) { toast('点数が入っていません'); return; }
    const rounded = Math.round(sum * 100) / 100;
    $('#f_total').value = String(rounded);
    toast('合計 ' + rounded + ' を入れました（必要なら調整可）');
  }

  function save() {
    const title = $('#f_title').value.trim();
    const totalRaw = $('#f_total').value.trim();
    if (!title) { toast('作品名を入力してください'); return; }
    if (totalRaw === '' || parseNum(totalRaw) === null) { toast('合計点を入力してください'); return; }

    if (editingId) {
      const e = entries.find((x) => x.id === editingId);
      if (!e) { closeSheets(); return; }
      e.title = title;
      FIELDS.forEach((f) => { e[f.key] = $('#f_' + f.key).value.trim(); });
      e.total = parseNum(totalRaw);
      e.note = $('#f_note').value.trim();
      e.link = $('#f_link').value.trim();
      toast('更新しました');
    } else {
      let max = 0;
      entries.forEach((x) => { max = Math.max(max, Number(x.order) || 0); });
      entries.push({
        id: uid(), title,
        char: $('#f_char').value.trim(),
        scenario: $('#f_scenario').value.trim(),
        art: $('#f_art').value.trim(),
        tempo: $('#f_tempo').value.trim(),
        other: $('#f_other').value.trim(),
        total: parseNum(totalRaw),
        note: $('#f_note').value.trim(),
        link: $('#f_link').value.trim(),
        order: max + 1
      });
      toast('追加しました');
    }
    persist();
    closeSheets();
    render();
  }

  /* ---------------- export / import ---------------- */
  function download(name, text, mime) {
    const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1200);
  }
  function stamp() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }
  function exportJson() {
    download('animemo-' + stamp() + '.json', JSON.stringify(entries, null, 2), 'application/json');
    toast('書き出しました');
  }
  function csvCell(v) {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function exportCsv() {
    const head = ['作品名', 'キャラ', 'シナリオ', '作画', 'テンポ', 'その他', '合計', '備考', 'リンク'];
    const rows = visibleEntries().map((e) => [e.title, e.char, e.scenario, e.art, e.tempo, e.other, e.total, e.note, e.link]);
    const csv = '\uFEFF' + [head].concat(rows).map((r) => r.map(csvCell).join(',')).join('\r\n');
    download('animemo-' + stamp() + '.csv', csv, 'text/csv;charset=utf-8');
    toast('CSVを書き出しました');
  }
  function importJson(file) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const data = JSON.parse(String(fr.result));
        if (!Array.isArray(data)) throw new Error('形式が違います');
        const clean = data.filter((x) => x && typeof x === 'object' && x.title).map((x, i) => ({
          id: x.id || uid(),
          title: String(x.title),
          char: x.char == null ? '' : String(x.char),
          scenario: x.scenario == null ? '' : String(x.scenario),
          art: x.art == null ? '' : String(x.art),
          tempo: x.tempo == null ? '' : String(x.tempo),
          other: x.other == null ? '' : String(x.other),
          total: parseNum(x.total),
          note: x.note == null ? '' : String(x.note),
          link: x.link == null ? '' : String(x.link),
          order: Number(x.order) || i + 1
        }));
        if (!clean.length) { toast('読み込める記録がありません'); return; }
        const merge = window.confirm(clean.length + '件を読み込みます。\n\n［OK］今の記録に追加する\n［キャンセル］今の記録を置き換える');
        if (merge) {
          const ids = new Set(entries.map((e) => e.id));
          let max = 0; entries.forEach((e) => { max = Math.max(max, Number(e.order) || 0); });
          clean.forEach((e) => { if (ids.has(e.id)) e.id = uid(); max += 1; e.order = max; entries.push(e); });
        } else {
          entries = clean;
        }
        persist(); render(); closeSheets();
        toast('読み込みました（' + clean.length + '件）');
      } catch (err) {
        toast('読み込めませんでした：' + (err && err.message ? err.message : '不明なエラー'));
      }
    };
    fr.readAsText(file);
  }

  /* ---------------- events ---------------- */
  $('#addbtn').addEventListener('click', () => { if (requireUnlock()) openForm(null); });
  $('#menubtn').addEventListener('click', () => openSheet(menuSheet));
  scrim.addEventListener('click', closeSheets);
  $('#cancelbtn').addEventListener('click', closeSheets);
  $('#menuclose').addEventListener('click', closeSheets);
  $('#savebtn').addEventListener('click', save);
  $('#calcbtn').addEventListener('click', calcTotal);

  listEl.addEventListener('click', (ev) => {
    const btn = ev.target.closest('[data-act]');
    if (!btn) return;
    const card = ev.target.closest('.card');
    if (!card) return;
    const id = card.getAttribute('data-id');
    const act = btn.getAttribute('data-act');
    if (act === 'toggle') {
      if (openIds.has(id)) openIds.delete(id); else openIds.add(id);
      render();
    } else if (act === 'edit') {
      if (requireUnlock()) openForm(id);
    } else if (act === 'del') {
      if (!requireUnlock()) return;
      const e = entries.find((x) => x.id === id);
      if (e && window.confirm('「' + e.title + '」を削除しますか？')) {
        entries = entries.filter((x) => x.id !== id);
        persist(); render(); toast('削除しました');
      }
    }
  });

  searchEl.addEventListener('input', () => { query = searchEl.value; render(); });
  sortSel.addEventListener('change', () => { sortKey = sortSel.value; render(); });
  sortDirBtn.addEventListener('click', () => {
    sortAsc = !sortAsc;
    sortDirBtn.textContent = sortAsc ? '↑' : '↓';
    render();
  });

  $('#m_lock').addEventListener('click', () => {
    if (unlocked) { unlocked = false; setLockUI(); closeSheets(); toast('ロックしました'); return; }
    const v = window.prompt('パスコードを入力してください');
    if (v === null) return;
    if (v === cfg.pass) { unlocked = true; setLockUI(); closeSheets(); toast('解錠しました'); }
    else toast('パスコードが違います');
  });
  $('#m_pass').addEventListener('click', () => {
    const cur = window.prompt('現在のパスコードを入力してください');
    if (cur === null) return;
    if (cur !== cfg.pass) { toast('現在のパスコードが違います'); return; }
    const nv = window.prompt('新しいパスコードを入力してください（1文字以上）');
    if (nv === null) return;
    if (!nv.trim()) { toast('空にはできません'); return; }
    cfg.pass = nv.trim(); persistCfg(); toast('パスコードを変更しました');
  });
  $('#m_export').addEventListener('click', () => { if (requireUnlock()) exportJson(); });
  $('#m_csv').addEventListener('click', exportCsv);
  const fileInput = $('#fileinput');
  $('#m_import').addEventListener('click', () => { if (requireUnlock()) fileInput.click(); });
  fileInput.addEventListener('change', () => {
    if (fileInput.files && fileInput.files[0]) importJson(fileInput.files[0]);
    fileInput.value = '';
  });
  $('#m_clear').addEventListener('click', () => {
    if (!requireUnlock()) return;
    if (!window.confirm('すべての記録を削除します。取り消せません。よろしいですか？')) return;
    entries = []; persist(); render(); closeSheets(); toast('すべて削除しました');
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheets(); });

  /* ---------------- boot ---------------- */
  load();
  setLockUI();
  render();
})();

</script>
