<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="description" content="アニメ作品を5項目で採点して記録する個人用メモアプリ">
<title>アニメ採点メモ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235fd8c4'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%2304231f'%3E★%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d14;--bg-glow:#1b2033;--panel:#151827;--panel-2:#1d2133;--line:#2b3149;
  --text:#eceef6;--dim:#8b93ab;--gold:#f0c260;--silver:#c2c9db;--bronze:#d18f5c;
  --accent:#5fd8c4;--accent-dim:#2f6b62;--warn:#e8736a;--purple:#9b8cf0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1100px 520px at 50% -12%, var(--bg-glow) 0%, var(--bg) 58%),var(--bg);
  color:var(--text);font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;
  min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:104px;
}
button,input,select,textarea{font-family:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.topbar{position:sticky;top:0;z-index:30;background:rgba(11,13,20,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:13px 14px 11px;}
.brand{display:flex;align-items:flex-end;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.brand h1{font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:18.5px;margin:0;letter-spacing:.01em;background:linear-gradient(92deg,var(--accent),#dff8f3 55%,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand .count{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--dim);}
.tools{display:flex;gap:7px;align-items:center;}
.search{flex:1 1 auto;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;}
.search::placeholder{color:var(--dim);}
select.sortsel{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 6px;font-size:12.5px;max-width:100px;}
.sortdir{flex:0 0 auto;width:38px;height:38px;background:var(--panel);border:1px solid var(--line);color:var(--accent);border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;}
.iconbtn{flex:0 0 auto;width:38px;height:38px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:16px;color:var(--text);cursor:pointer;}
.errbar{background:#3a1f1c;border-bottom:1px solid #6a3b36;color:#ffd9d4;font-size:11.5px;line-height:1.65;padding:9px 14px;}
.errbar b{display:block;font-size:12px;margin-bottom:3px;color:#ffb9b1;}
.list{padding:9px 10px;display:flex;flex-direction:column;gap:6px;}
.empty{text-align:center;color:var(--dim);padding:64px 22px;font-size:13.5px;line-height:1.9;}
.empty b{display:block;font-family:'Zen Maru Gothic',sans-serif;font-size:15px;color:var(--text);margin-bottom:6px;font-weight:700;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .16s ease,background .16s ease;}
.card.open{border-color:var(--accent-dim);background:var(--panel-2);}
.head{display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer;user-select:none;}
.rank{flex:0 0 auto;width:26px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:#9aa2b8;}
.rank.r1{color:var(--gold);font-size:15px;}
.rank.r2{color:var(--silver);font-size:15px;}
.rank.r3{color:var(--bronze);font-size:15px;}
.rank.plain{color:#9aa2b8;font-size:12.5px;}
.mid{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px;}
.title{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.date{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);}
.total{flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;color:var(--accent);}
.total small{font-size:10px;color:var(--dim);margin-left:2px;}
.chev{flex:0 0 auto;color:var(--dim);font-size:11px;transition:transform .16s ease;}
.card.open .chev{transform:rotate(180deg);}
.body{display:none;padding:2px 11px 11px;border-top:1px dashed var(--line);}
.card.open .body{display:block;}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:10px 0 9px;}
.cell{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;}
.cell .k{display:block;font-size:9.5px;color:var(--dim);margin-bottom:3px;}
.cell .v{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;word-break:break-all;}
.cell .v.hot{color:#ff6b5e;}
.total.t-red{color:#ff5b52;}
.total.t-gold{color:var(--gold);}
.total.t-silver{color:var(--silver);}
.total.t-bronze{color:var(--bronze);}
.note{font-size:12.5px;line-height:1.75;color:#cdd3e4;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--purple);border-radius:8px;padding:8px 10px;margin-bottom:9px;white-space:pre-wrap;word-break:break-word;}
.rowbtns{display:flex;gap:7px;flex-wrap:wrap;}
.mini{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:9px 13px;font-size:12.5px;cursor:pointer;text-decoration:none;display:inline-block;min-height:38px;line-height:1.4;}
.mini.link{color:var(--accent);}
.mini.del{color:var(--warn);margin-left:auto;}
.mini.primary{background:linear-gradient(145deg,var(--accent),#3fb6a4);color:#04231f;border-color:transparent;font-weight:700;}
.copybox{margin-top:8px;display:flex;gap:7px;align-items:stretch;}
.copytxt{
  flex:1 1 auto;min-width:0;background:var(--bg);border:1px solid var(--accent-dim);
  border-radius:8px;padding:9px 10px;font-size:12.5px;line-height:1.65;color:var(--text);
  font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;
  resize:none;min-height:60px;-webkit-user-select:all;user-select:all;
}
.fab{position:fixed;right:16px;bottom:20px;z-index:35;width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;font-size:27px;line-height:1;font-weight:700;background:linear-gradient(145deg,var(--accent),#3fb6a4);color:#04231f;box-shadow:0 10px 26px rgba(95,216,196,.3);}
.locked .fab{background:linear-gradient(145deg,#3b4157,#2b3048);color:var(--dim);box-shadow:none;}
.scrim{position:fixed;inset:0;background:rgba(5,6,11,.72);z-index:40;display:none;}
.scrim.show{display:block;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92vh;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 15px 26px;transform:translateY(102%);transition:transform .24s cubic-bezier(.22,.7,.2,1);box-shadow:0 -12px 34px rgba(0,0,0,.5);}
.sheet.show{transform:translateY(0);}
#dialogsheet{z-index:70;}
#passsheet{z-index:70;}
.sheet h2{font-family:'Zen Maru Gothic',sans-serif;font-size:16px;font-weight:700;margin:0 0 3px;}
.sheet .hint{font-size:11.5px;color:var(--dim);margin:0 0 14px;line-height:1.7;white-space:pre-wrap;}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 12px;}
label.f{display:block;margin-bottom:11px;}
label.f span{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:14px;}
.inp::placeholder{color:#5f677d;}
textarea.inp{resize:vertical;min-height:62px;font-size:13.5px;line-height:1.7;}
textarea.mono{font-family:'IBM Plex Mono',monospace;font-size:11.5px;min-height:150px;line-height:1.6;}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.totalwrap{display:flex;gap:6px;align-items:stretch;}
.totalwrap .inp{flex:1 1 auto;min-width:0;}
.calcbtn{
  flex:1 1 auto;white-space:nowrap;border:1px dashed var(--accent-dim);
  background:rgba(95,216,196,.09);color:var(--accent);border-radius:9px;
  padding:10px 12px;font-size:13px;font-weight:700;cursor:pointer;
}
.calcbtn:active{border-style:solid;}
.hide{display:none !important;}
.actrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.btn{flex:1 1 40%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:13px 10px;font-size:14px;font-weight:700;cursor:pointer;}
.btn.primary{background:linear-gradient(145deg,var(--accent),#3fb6a4);color:#04231f;border-color:transparent;}
.btn.ghost{color:var(--dim);}
.btn.warn{color:var(--warn);}
.sub{border:none;background:none;color:var(--accent);font-size:12px;padding:0 0 11px;cursor:pointer;text-decoration:underline;}
.menurow{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:13px;margin-bottom:8px;font-size:13.5px;cursor:pointer;text-align:left;width:100%;}
.menurow small{display:block;color:var(--dim);font-size:11px;margin-top:3px;font-weight:400;}
.menurow .arw{color:var(--dim);}
.menurow.warn{color:var(--warn);}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid var(--accent-dim);color:var(--accent);vertical-align:1px;}
.badge.off{border-color:var(--line);color:var(--dim);}
.badge.busy{border-color:#4a4470;color:var(--purple);}
.badge.err{border-color:#6a3b36;color:var(--warn);}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,14px);background:#eef1f8;color:#12131a;font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:22px;z-index:80;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;max-width:86vw;text-align:center;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.foot{text-align:center;color:#565d73;font-size:10.5px;line-height:1.8;padding:14px 20px 4px;}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>アニメ採点メモ</h1>
    <span class="count" id="count">0件</span>
    <span class="badge off" id="syncBadge">この端末のみ</span>
  </div>
  <div class="tools">
    <input id="search" class="search" type="search" placeholder="作品名で検索" autocomplete="off">
    <select id="sortsel" class="sortsel" aria-label="並べ替え">
      <option value="total">合計</option>
      <option value="char">キャラ</option>
      <option value="scenario">シナリオ</option>
      <option value="art">作画</option>
      <option value="tempo">テンポ</option>
      <option value="other">追加点</option>
      <option value="title">作品名</option>
      <option value="order">追加順</option>
    </select>
    <button id="sortdir" class="sortdir" title="昇順 / 降順">↓</button>
    <button id="menubtn" class="iconbtn" title="メニュー">⋯</button>
  </div>
</header>
<div class="errbar" id="errbar" hidden></div>

<main id="list" class="list"></main>
<div class="foot" id="foot"></div>

<button id="addbtn" class="fab" title="作品を追加">＋</button>
<div class="scrim" id="scrim"></div>

<!-- 追加 / 編集シート -->
<section class="sheet" id="formsheet" aria-hidden="true">
  <div class="grab"></div>
  <h2 id="formtitle">作品を追加</h2>
  <p class="hint" id="formhint">4項目には当てはまらない評価点、言葉にできない点数を追加点として入力することができます。</p>
  <label class="f"><span>作品名 <em style="color:var(--warn);font-style:normal">*</em></span>
    <input id="f_title" class="inp" type="text" placeholder="例：〇〇の物語" autocomplete="off"></label>
  <div class="three">
    <label class="f"><span>キャラ</span><input id="f_char" class="inp" type="text" inputmode="decimal"></label>
    <label class="f"><span>シナリオ</span><input id="f_scenario" class="inp" type="text" inputmode="decimal"></label>
    <label class="f"><span>作画</span><input id="f_art" class="inp" type="text" inputmode="decimal"></label>
  </div>
  <div class="three">
    <label class="f"><span>テンポ</span><input id="f_tempo" class="inp" type="text" inputmode="decimal"></label>
    <label class="f"><span>追加点</span><input id="f_other" class="inp" type="text" inputmode="decimal"></label>
    <label class="f"><span>合計 <em style="color:var(--warn);font-style:normal">*</em></span>
      <span class="totalwrap">
        <input id="f_total" class="inp" type="text" inputmode="decimal">
        <button id="calcbtn" class="calcbtn" type="button">自動計算</button>
      </span></label>
  </div>
  <div class="two">
    <label class="f"><span>作成日</span><input id="f_createdAt" class="inp" type="date"></label>
    <label class="f"><span>視聴回数（周）</span><input id="f_watch" class="inp" type="number" min="1" step="1" inputmode="numeric"></label>
  </div>
  <label class="f"><span>備考</span><textarea id="f_note" class="inp" placeholder="感想・メモなど"></textarea></label>
  <label class="f"><span>作品公式Twitter（URL）</span><input id="f_link" class="inp" type="url" placeholder="https://" autocomplete="off"></label>
  <div class="actrow">
    <button class="btn ghost" id="cancelbtn" type="button">やめる</button>
    <button class="btn primary" id="savebtn" type="button">保存</button>
  </div>
</section>

<!-- メニューシート -->
<section class="sheet" id="menusheet" aria-hidden="true">
  <div class="grab"></div>
  <h2>メニュー</h2>
  <p class="hint" id="menuhint">追加・編集・削除のときはパスワードの入力が必要です。</p>
  <button class="menurow" id="m_cloud" type="button"><span>共有サーバーの設定・確認<small id="menucloudsmall">現在の状態を表示</small></span><span class="arw">›</span></button>
  <button class="menurow" id="m_export" type="button"><span>バックアップを書き出す（JSON）<small>機種変更・復元用</small></span><span class="arw">›</span></button>
  <button class="menurow" id="m_import" type="button"><span>バックアップを読み込む（JSON）<small>書き出したファイルを選択</small></span><span class="arw">›</span></button>
  <button class="menurow" id="m_csv" type="button"><span>表形式で書き出す（CSV）<small>Excel やスプレッドシート用</small></span><span class="arw">›</span></button>
  <p class="hint" id="cloudhint" style="margin:14px 0 0"></p>
  <div class="actrow"><button class="btn ghost" id="menuclose" type="button">閉じる</button></div>
</section>

<!-- 共有サーバー設定シート -->
<section class="sheet" id="cloudsheet" aria-hidden="true">
  <div class="grab"></div>
  <h2>共有サーバーの設定</h2>
  <p class="hint" id="cloudstate"></p>
  <label class="f"><span>Firebase の設定（そのまま貼り付けでOK）</span>
    <textarea id="c_config" class="inp mono" spellcheck="false" placeholder='const firebaseConfig = {
  apiKey: "AIza...",
  authDomain: "xxxx.firebaseapp.com",
  databaseURL: "https://xxxx-default-rtdb.REGION.firebasedatabase.app",
  projectId: "xxxx",
  appId: "1:1234:web:abcd"
};'></textarea></label>
  <label class="f"><span>部屋名（同じ名前にした端末どうしで共有されます）</span>
    <input id="c_room" class="inp" type="text" autocomplete="off"></label>
  <p class="hint" style="margin:-4px 0 0">部屋名は共有の鍵代わりです。他人に教えないでください。</p>
  <div class="actrow">
    <button class="btn ghost" id="c_cancel" type="button">やめる</button>
    <button class="btn primary" id="c_save" type="button">保存して再接続</button>
  </div>
  <div class="actrow">
    <button class="btn ghost" id="c_reset" type="button">この端末の設定を消す（ファイルの設定に戻す）</button>
  </div>
</section>

<!-- パスワード -->
<section class="sheet" id="passsheet" aria-hidden="true">
  <div class="grab"></div>
  <h2>パスワード</h2>
  <p class="hint" id="passhint">パスワードを入力してください</p>
  <label class="f"><span>パスワード</span>
    <input id="passinput" class="inp" type="password" inputmode="numeric" autocomplete="off" placeholder="4桁の数字"></label>
  <div class="actrow">
    <button class="btn ghost" id="passcancel" type="button">やめる</button>
    <button class="btn primary" id="passok" type="button">決定</button>
  </div>
</section>

<!-- 確認ダイアログ -->
<section class="sheet" id="dialogsheet" aria-hidden="true">
  <div class="grab"></div>
  <h2 id="dialogtitle">確認</h2>
  <p class="hint" id="dialogmsg"></p>
  <div class="actrow" id="dialogbtns"></div>
</section>

<input type="file" id="fileinput" accept=".json,application/json" style="display:none">
<div class="toast" id="toast"></div>

<script>
/* ============================================================================
   アニメ採点メモ
   ----------------------------------------------------------------------------
   下の設定は、画面の「⋯ → 共有サーバーの設定・確認」からも変更できます。
   わざわざこのファイルを書き換えなくても大丈夫です。

   ※変数名は FIREBASE_CONFIG でも firebaseConfig でも動くようにしてあります。
   ==========================================================================*/

/* ---- 共有サーバー（Firebase）の設定 ---- */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDU5pQ8asjtrTdSHAWF6tunod-PYcfsJ0Y",
  authDomain: "animememo-fd517.firebaseapp.com",
  databaseURL: "https://animememo-fd517-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "animememo-fd517",
  storageBucket: "animememo-fd517.firebasestorage.app",
  messagingSenderId: "923580011798",
  appId: "1:923580011798:web:3a645b50f3974e2c146c37"
};
/* ---- 部屋名（同じ名前にした端末どうしで記録を共有します） ---- */
const DB_ROOM = "animemo-7k2q9";
/* ---- Firebase の「匿名認証」を有効にした場合は true ---- */
const USE_ANONYMOUS_AUTH = true;

/* ==========================================================================*/
(function () {
  'use strict';

  const FB_VERSION = '10.13.0';
  const LS_KEY = 'animemo.entries.v2';
  const LS_OLD = 'animemo.entries.v1';
  const LS_CFG = 'animemo.config.v1';
  const LS_CLOUD = 'animemo.cloud.v1';
  /* パスワードは 4253 で固定（変更できません） */
  const PASS = '4253';
  const ITEM_RED = 20;

  const FIELDS = [
    { key: 'char', label: 'キャラ' },
    { key: 'scenario', label: 'シナリオ' },
    { key: 'art', label: '作画' },
    { key: 'tempo', label: 'テンポ' },
    { key: 'other', label: '追加点' }
  ];

  const $ = (s) => document.querySelector(s);
  const listEl = $('#list');
  const countEl = $('#count');
  const syncBadge = $('#syncBadge');
  const errbar = $('#errbar');
  const footEl = $('#foot');
  const searchEl = $('#search');
  const sortSel = $('#sortsel');
  const sortDirBtn = $('#sortdir');
  const scrim = $('#scrim');
  const formSheet = $('#formsheet');
  const menuSheet = $('#menusheet');
  const cloudSheet = $('#cloudsheet');
  const passSheet = $('#passsheet');
  const dialogSheet = $('#dialogsheet');
  const toastEl = $('#toast');

  const items = new Map();
  let editingId = null;
  let sortKey = 'total';
  let sortAsc = false;
  let query = '';
  const openIds = new Set();
  const copyOpen = new Set();

  let cloudRef = null;
  let cloudMode = false;
  let syncState = 'local';
  let syncDetail = '';
  let activeConfig = null;
  let activeRoom = '';

  /* ---------------- 小道具 ---------------- */
  function parseNum(v) {
    if (v === null || v === undefined) return null;
    const s = String(v).trim();
    if (s === '') return null;
    const half = s.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).replace(/[，,\s]/g, '');
    const n = Number(half);
    return Number.isFinite(n) ? n : null;
  }
  function fmtNum(v) {
    if (v === null || v === undefined || v === '') return '—';
    return String(v);
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function uid() {
    return 'e' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
  }
  function todayISO() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function fmtDate(iso) {
    if (!iso) return '';
    const m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String(iso));
    if (!m) return String(iso);
    return m[1] + '/' + m[2].padStart(2, '0') + '/' + m[3].padStart(2, '0');
  }
  /* 日付の差（日数） */
  function daysBetween(fromISO, toISO) {
    const a = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String(fromISO || ''));
    const b = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String(toISO || ''));
    if (!a || !b) return null;
    return Math.round((Date.UTC(+b[1], +b[2] - 1, +b[3]) - Date.UTC(+a[1], +a[2] - 1, +a[3])) / 86400000);
  }
  /* 前回視聴〇〇日前 */
  function gapText(e) {
    if (!e || !e.prevDate || !e.createdAt) return '';
    const n = daysBetween(e.prevDate, e.createdAt);
    if (n === null) return '';
    return '前回視聴' + Math.max(0, n) + '日前';
  }
  /* 〇〇周視聴 */
  function watchText(e) {
    const n = parseNum(e && e.watchCount);
    return (n === null || n < 1 ? 1 : Math.floor(n)) + '周視聴';
  }
  /* 追加順の並べ替えに使う日付 */
  function dateVal(e) {
    const m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String((e && e.createdAt) || ''));
    if (!m) return null;
    return Date.UTC(+m[1], +m[2] - 1, +m[3]);
  }
  /* 合計点の色分け */
  function totalClass(v) {
    const n = parseNum(v);
    if (n === null) return '';
    if (n >= 100) return ' t-red';
    if (n >= 90) return ' t-gold';
    if (n >= 80) return ' t-silver';
    if (n >= 70) return ' t-bronze';
    return '';
  }
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('スクリプトを読み込めませんでした: ' + src));
      document.head.appendChild(s);
    });
  }
  function norm(x) {
    const o = {};
    o.id = String(x.id || uid());
    o.title = x.title == null ? '' : String(x.title);
    FIELDS.forEach((f) => { o[f.key] = x[f.key] == null ? '' : String(x[f.key]); });
    const t = parseNum(x.total);
    o.total = t === null ? null : t;
    o.note = x.note == null ? '' : String(x.note);
    o.link = x.link == null ? '' : String(x.link);
    o.createdAt = typeof x.createdAt === 'string' ? x.createdAt : '';
    o.prevDate = typeof x.prevDate === 'string' ? x.prevDate : '';
    const w = parseNum(x.watchCount);
    o.watchCount = (w === null || w < 1) ? 1 : Math.floor(w);
    o.order = Number(x.order) || 0;
    return o;
  }

  /* ---------------- 設定の解決（ファイル or 画面で保存した設定） ---------------- */
  function embeddedConfig() {
    let c = null;
    try { if (typeof FIREBASE_CONFIG !== 'undefined' && FIREBASE_CONFIG) c = FIREBASE_CONFIG; } catch (e) {}
    if (!c) { try { if (typeof firebaseConfig !== 'undefined' && firebaseConfig) c = firebaseConfig; } catch (e) {} }
    return c;
  }
  function embeddedRoom() {
    let r = '';
    try { if (typeof DB_ROOM !== 'undefined' && DB_ROOM) r = DB_ROOM; } catch (e) {}
    return r || 'animemo-room-change-me';
  }
  function savedCloud() {
    try {
      const raw = localStorage.getItem(LS_CLOUD);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function sanitizeRoom(r) {
    return String(r || '').trim().replace(/[.#$/\[\]]/g, '_') || 'animemo-room-change-me';
  }
  /* URL の末尾に ?local=1 を付けると、共有を使わずこの端末のみで動作します（設定ミス時の切り分け用） */
  function forceLocal() {
    try { return /[?&]local=1/.test(String(window.location.search || '')); } catch (e) { return false; }
  }
  function parseConfigText(t) {
    const s = String(t || '').trim();
    if (!s) return null;
    const m = s.match(/\{[\s\S]*\}/);
    const body = m ? m[0] : s;
    try {
      const o = JSON.parse(body);
      if (o && typeof o === 'object' && !Array.isArray(o)) return o;
    } catch (e) {}
    const o2 = {};
    const re = /([A-Za-z0-9_]+)\s*:\s*["']([^"']*)["']/g;
    let mm;
    while ((mm = re.exec(body))) o2[mm[1]] = mm[2];
    return Object.keys(o2).length ? o2 : null;
  }
  function resolveSettings() {
    const sc = savedCloud();
    const fileCfg = embeddedConfig();
    const useSaved = !!(sc && sc.config && sc.config.databaseURL && sc.config.apiKey);
    const conf = useSaved ? sc.config : fileCfg;
    const room = sanitizeRoom(useSaved ? (sc.room || embeddedRoom()) : embeddedRoom());
    const from = useSaved ? '画面で保存した設定' : 'ファイルの設定';
    if (forceLocal()) return { config: null, room: room, from: 'URLの ?local=1 指定（この端末のみ）' };
    return { config: conf, room: room, from: from };
  }

  /* ---------------- 保存 ---------------- */
  function cacheSave() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(Array.from(items.values()))); } catch (e) {}
  }
  function loadLocal() {
    let arr = null;
    try {
      const raw = localStorage.getItem(LS_KEY) || localStorage.getItem(LS_OLD);
      if (raw) arr = JSON.parse(raw);
    } catch (e) { arr = null; }
    if (!Array.isArray(arr)) arr = [];
    let max = 0;
    arr.forEach((e) => { max = Math.max(max, Number(e.order) || 0); });
    arr.forEach((e) => {
      const n = norm(e);
      if (!n.order) { max += 1; n.order = max; }
      items.set(n.id, n);
    });
  }
  function nextOrder() {
    let max = 0;
    items.forEach((e) => { max = Math.max(max, Number(e.order) || 0); });
    return max + 1;
  }
  function putEntry(entry) {
    items.set(entry.id, entry);
    cacheSave();
    if (cloudMode && cloudRef) {
      cloudRef.child(entry.id).set(entry).catch((err) => {
        toast('共有サーバーへの保存に失敗しました');
        setSync('error', fbHint(err));
      });
    }
    render();
  }
  function dropEntry(id) {
    items.delete(id);
    cacheSave();
    if (cloudMode && cloudRef) {
      cloudRef.child(id).remove().catch((err) => {
        toast('共有サーバーからの削除に失敗しました');
        setSync('error', fbHint(err));
      });
    }
    render();
  }

  /* ---------------- エラー表示 ---------------- */
  function fbHint(err) {
    const code = err && err.code ? String(err.code) : '';
    const msg = err && err.message ? String(err.message) : String(err || '不明なエラー');
    if (code === 'auth/operation-not-allowed' || /operation-not-allowed/.test(msg)) {
      return '匿名認証が有効になっていません。Firebase コンソール → Authentication → Sign-in method → 「匿名」を有効にしてください。';
    }
    if (/permission_denied|Permission denied/i.test(msg)) {
      return 'データベースのルールで拒否されました（Permission denied）。Realtime Database → ルール を確認してください。';
    }
    if (/auth\/admin-restricted|unauthorized|API key/i.test(msg)) {
      return '設定値（apiKey など）が正しくない可能性があります。Firebase コンソールの firebaseConfig を貼り直してください。';
    }
    return msg;
  }
  function setSync(state, detail) {
    syncState = state;
    syncDetail = detail || '';
    const h = $('#cloudhint');
    const ms = $('#menucloudsmall');
    const cs = $('#cloudstate');

    if (state === 'online') {
      syncBadge.textContent = '共有中';
      syncBadge.className = 'badge';
      errbar.hidden = true;
      footEl.textContent = '記録は共有サーバーに保存され、どの端末で見ても同じ内容になります';
      if (h) h.textContent = '共有モードで動作中です（部屋名: ' + activeRoom + '）';
      if (ms) ms.textContent = '共有中（部屋名: ' + activeRoom + '）';
      if (cs) cs.textContent = '共有中です。\n接続先: ' + (activeConfig && activeConfig.databaseURL ? activeConfig.databaseURL : '') + '\n部屋名: ' + activeRoom + '\n設定の出どころ: ' + (activeConfig && activeConfig.__from ? activeConfig.__from : '');
    } else if (state === 'connecting') {
      syncBadge.textContent = '接続中…';
      syncBadge.className = 'badge busy';
      errbar.hidden = true;
      footEl.textContent = '共有サーバーに接続しています…';
      if (h) h.textContent = '共有サーバーに接続中です…';
      if (ms) ms.textContent = '接続中…';
      if (cs) cs.textContent = '接続中です…';
    } else if (state === 'error') {
      syncBadge.textContent = '同期エラー';
      syncBadge.className = 'badge err';
      errbar.hidden = false;
      errbar.innerHTML = '<b>共有サーバーに接続できませんでした（今はこの端末だけに保存されます）</b>' + esc(detail);
      footEl.textContent = '共有サーバーに接続できませんでした。記録はこの端末にだけ保存されます';
      if (h) h.textContent = '共有サーバーに接続できませんでした。\n' + detail;
      if (ms) ms.textContent = '接続できません（詳細を開く）';
      if (cs) cs.textContent = '接続できませんでした。\n' + detail + '\n\n設定を貼り直して「保存して再接続」を押してください。';
    } else {
      syncBadge.textContent = 'この端末のみ';
      syncBadge.className = 'badge off';
      errbar.hidden = true;
      footEl.textContent = '記録はこの端末のブラウザにだけ保存されます（他の端末とは共有されません）';
      if (h) h.textContent = 'いまは「この端末のみ」モードです。共有するには「共有サーバーの設定・確認」を開いてください。';
      if (ms) ms.textContent = '未設定（この端末のみ）';
      if (cs) cs.textContent = '未設定です。「この端末のみ」モードで動作しています。';
    }
  }

  /* ---------------- クラウド接続 ---------------- */
  function openCloudSheet() {
    const st = resolveSettings();
    const sc = savedCloud();
    const emb = embeddedConfig();
    $('#c_config').value = (sc && sc.raw) ? sc.raw : (emb ? JSON.stringify(emb, null, 2) : '');
    $('#c_room').value = st.room;
    openSheet(cloudSheet);
  }
  function saveCloudFromSheet() {
    const raw = $('#c_config').value.trim();
    const room = $('#c_room').value.trim();
    const parsed = parseConfigText(raw);
    if (!raw) {
      try { localStorage.removeItem(LS_CLOUD); } catch (e) {}
      toast('画面の設定を消しました。ファイルの設定を使います');
      closeAllSheets();
      reconnect();
      return;
    }
    if (!parsed || !parsed.databaseURL || !parsed.apiKey) {
      toast('設定を読み取れませんでした（apiKey と databaseURL が必要です）');
      return;
    }
    if (!room) { toast('部屋名を入力してください'); return; }
    try {
      localStorage.setItem(LS_CLOUD, JSON.stringify({ config: parsed, room: sanitizeRoom(room), raw: raw }));
    } catch (e) { toast('保存できませんでした'); return; }
    closeAllSheets();
    toast('設定を保存しました。再接続します');
    reconnect();
  }
  function clearSavedCloud() {
    try { localStorage.removeItem(LS_CLOUD); } catch (e) {}
    $('#c_config').value = '';
    toast('この端末の設定を消しました');
    reconnect();
  }

  function reconnect() {
    cloudRef = null;
    cloudMode = false;
    try { if (window.firebase && window.firebase.database) { window.firebase.database().ref().off(); } } catch (e) {}
    initCloud();
  }

  async function initCloud() {
    const st = resolveSettings();
    if (!st.config || !st.config.apiKey || !st.config.databaseURL) {
      activeConfig = null; activeRoom = st.room;
      setSync('local');
      return;
    }
    activeConfig = Object.assign({}, st.config, { __from: st.from });
    activeRoom = st.room;
    setSync('connecting');
    try {
      const fb0 = window.firebase;
      if (!fb0) {
        await loadScript('https://www.gstatic.com/firebasejs/' + FB_VERSION + '/firebase-app-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/' + FB_VERSION + '/firebase-database-compat.js');
        if (USE_ANONYMOUS_AUTH) {
          await loadScript('https://www.gstatic.com/firebasejs/' + FB_VERSION + '/firebase-auth-compat.js');
        }
      }
      const fb = window.firebase;
      if (!fb) throw new Error('Firebase SDK を初期化できませんでした');
      if (!fb.apps || !fb.apps.length) fb.initializeApp(st.config);
      if (USE_ANONYMOUS_AUTH && fb.auth) {
        if (!fb.auth().currentUser) {
          try { await fb.auth().signInAnonymously(); }
          catch (err) { throw err; }
        }
      }
      cloudRef = fb.database().ref('rooms/' + activeRoom + '/items');
      const snap = await cloudRef.once('value');
      const localSnapshot = Array.from(items.values());
      items.clear();
      snap.forEach((ch) => { items.set(ch.key, norm(Object.assign({ id: ch.key }, ch.val() || {}))); });
      cloudMode = true;
      cacheSave();
      render();
      setSync('online');
      watchCloud(cloudRef);
      if (!snap.exists() && localSnapshot.length) askUploadLocal(localSnapshot);
    } catch (err) {
      cloudMode = false;
      setSync('error', fbHint(err));
    }
  }
  function watchCloud(ref) {
    const apply = (snap) => {
      const e = norm(Object.assign({ id: snap.key }, snap.val() || {}));
      items.set(e.id, e);
      cacheSave();
      render();
    };
    ref.on('child_added', apply);
    ref.on('child_changed', apply);
    ref.on('child_removed', (snap) => {
      items.delete(snap.key);
      cacheSave();
      render();
    });
  }
  async function askUploadLocal(list) {
    const pick = await askChoice({
      title: 'この端末の記録を共有しますか？',
      msg: '共有サーバーはまだ空です。\nこの端末にある ' + list.length + ' 件の記録を共有サーバーにアップロードしますか？\n（以後は、同じ設定の端末すべてで同じ記録が見られます）',
      buttons: [
        { label: 'アップロードする', value: 'yes', kind: 'primary' },
        { label: 'あとで', value: 'no', kind: 'ghost' }
      ]
    });
    if (pick !== 'yes' || !cloudRef) return;
    let ok = 0;
    for (const e of list) {
      try { await cloudRef.child(e.id).set(e); ok += 1; } catch (err) {}
    }
    toast(ok + '件を共有サーバーにアップロードしました');
  }

  /* ---------------- コピー用テキスト ----------------
     表示形式: タイトル キャラ〇〇 シナリオ〇〇 作画〇〇 テンポ〇〇 追加点〇〇 合計〇〇点
     （区切りは半角スペース、ラベルと数字の間に空白は入れない、点は合計のみ） */
  function copyText(e) {
    if (!e) return '';
    return String(e.title || '').trim()
      + ' キャラ' + fmtNum(e.char)
      + ' シナリオ' + fmtNum(e.scenario)
      + ' 作画' + fmtNum(e.art)
      + ' テンポ' + fmtNum(e.tempo)
      + ' 追加点' + fmtNum(e.other)
      + ' 合計' + fmtNum(e.total) + '点';
  }
  /* クリップボードへコピー（だめなら textarea + execCommand で代替） */
  async function copyString(s) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(s);
        return true;
      }
    } catch (err) { /* 代替手段へ */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = s;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '0';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { ta.setSelectionRange(0, s.length); } catch (err) {}
      const ok = document.execCommand('copy');
      ta.remove();
      return !!ok;
    } catch (err) { return false; }
  }
  function selectCopyBox(id) {
    try {
      const box = listEl.querySelector('.card[data-id="' + id + '"] .copytxt');
      if (box) { box.focus(); box.select(); }
    } catch (err) {}
  }

  /* ---------------- 描画 ---------------- */
  function totalOf(e) {
    const n = parseNum(e.total);
    return n === null ? -Infinity : n;
  }
  function all() { return Array.from(items.values()); }
  function visibleEntries() {
    const q = query.trim().toLowerCase();
    let arr = all();
    if (q) arr = arr.filter((e) => String(e.title || '').toLowerCase().includes(q));
    const dir = sortAsc ? 1 : -1;
    arr.sort((a, b) => {
      let av, bv;
      if (sortKey === 'title') return String(a.title || '').localeCompare(String(b.title || ''), 'ja') * dir;
      if (sortKey === 'order') {
        const da = dateVal(a), db2 = dateVal(b);
        if (da !== null && db2 !== null && da !== db2) return (da - db2) * dir;
        if (da !== null && db2 === null) return -1 * dir;
        if (da === null && db2 !== null) return 1 * dir;
        return ((Number(a.order) || 0) - (Number(b.order) || 0)) * dir;
      }
      if (sortKey === 'total') { av = totalOf(a); bv = totalOf(b); }
      else {
        const na = parseNum(a[sortKey]), nb = parseNum(b[sortKey]);
        av = na === null ? -Infinity : na;
        bv = nb === null ? -Infinity : nb;
      }
      if (av === bv) return (Number(a.order) || 0) - (Number(b.order) || 0);
      return (av - bv) * dir;
    });
    return arr;
  }
  function render() {
    const arr = visibleEntries();
    countEl.textContent = (query.trim() ? arr.length + ' / ' : '') + items.size + '件';

    if (!arr.length) {
      listEl.innerHTML = items.size
        ? '<div class="empty"><b>該当なし</b>検索語を変えてみてください。</div>'
        : '<div class="empty"><b>まだ記録がありません</b>右下の ＋ から作品を追加すると、ここに一覧が並びます。</div>';
      return;
    }
    /* 合計点による順位（同点は同順位、次の順位は飛ばす） */
    const rankMap = new Map();
    const ranked = all().filter((e) => parseNum(e.total) !== null).slice().sort((a, b) => totalOf(b) - totalOf(a));
    let prevTotal = null, prevRank = 0;
    ranked.forEach((e, i) => {
      const t = totalOf(e);
      const r = (prevTotal !== null && t === prevTotal) ? prevRank : i + 1;
      rankMap.set(e.id, r);
      prevTotal = t; prevRank = r;
    });

    listEl.innerHTML = arr.map((e) => {
      const open = openIds.has(e.id);
      const rk = rankMap.get(e.id);
      const mark = rk ? String(rk) : '–';
      const rankCls = rk ? (rk <= 3 ? ' r' + rk : ' plain') : '';
      const cells = FIELDS.map((f) => {
        const n = parseNum(e[f.key]);
        const hot = (n !== null && n >= ITEM_RED) ? ' hot' : '';
        return '<div class="cell"><span class="k">' + esc(f.label) + '</span><span class="v' + hot + '">' + esc(fmtNum(e[f.key])) + '</span></div>';
      }).join('');
      const link = String(e.link || '').trim();
      const linkHtml = link
        ? '<a class="mini link" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">作品公式Twitterを開く</a>'
        : '';
      const isCopy = copyOpen.has(e.id);
      const copyBox = isCopy
        ? '<div class="copybox">' +
            '<textarea class="copytxt" readonly rows="2" spellcheck="false" aria-label="コピー用テキスト">' + esc(copyText(e)) + '</textarea>' +
            '<button class="mini primary" data-act="copy">コピー</button>' +
          '</div>'
        : '';
      const noteHtml = String(e.note || '').trim() ? '<div class="note">' + esc(e.note) + '</div>' : '';
      const dateParts = [e.createdAt ? '作成日 ' + fmtDate(e.createdAt) : '作成日 未設定'];
      const gap = gapText(e);
      if (gap) dateParts.push(gap);
      dateParts.push(watchText(e));
      const dateTxt = dateParts.join(' ');
      return '' +
        '<article class="card' + (open ? ' open' : '') + '" data-id="' + esc(e.id) + '">' +
          '<div class="head" data-act="toggle">' +
            '<span class="rank' + rankCls + '">' + mark + '</span>' +
            '<span class="mid">' +
              '<span class="title">' + esc(e.title) + '</span>' +
              '<span class="date">' + esc(dateTxt) + '</span>' +
            '</span>' +
            '<span class="total' + totalClass(e.total) + '">' + esc(fmtNum(e.total)) + '<small>点</small></span>' +
            '<span class="chev">▼</span>' +
          '</div>' +
          '<div class="body">' +
            '<div class="grid">' + cells + '</div>' +
            noteHtml +
            '<div class="rowbtns">' + linkHtml +
              '<button class="mini" data-act="edit">編集</button>' +
              '<button class="mini" data-act="copyopen">' + (isCopy ? 'テキストを閉じる' : 'コピー用テキスト') + '</button>' +
              '<button class="mini del" data-act="del">削除</button>' +
            '</div>' +
            copyBox +
          '</div>' +
        '</article>';
    }).join('');
  }

  /* ---------------- シート ---------------- */
  const SHEETS = () => [formSheet, menuSheet, cloudSheet, passSheet, dialogSheet];
  function anyOpen() { return SHEETS().some((s) => s.classList.contains('show')); }
  function openSheet(el) {
    el.classList.add('show');
    el.setAttribute('aria-hidden', 'false');
    scrim.classList.add('show');
  }
  function closeSheet(el) {
    el.classList.remove('show');
    el.setAttribute('aria-hidden', 'true');
    if (!anyOpen()) scrim.classList.remove('show');
  }
  function closeAllSheets() {
    if (passResolve) { const r = passResolve; passResolve = null; r(false); }
    SHEETS().forEach((s) => {
      s.classList.remove('show');
      s.setAttribute('aria-hidden', 'true');
    });
    scrim.classList.remove('show');
    editingId = null;
  }
  let dialogResolve = null;
  function askChoice(opts) {
    return new Promise((resolve) => {
      if (dialogResolve) { const p = dialogResolve; dialogResolve = null; p('cancel'); }
      dialogResolve = resolve;
      $('#dialogtitle').textContent = opts.title || '確認';
      $('#dialogmsg').textContent = opts.msg || '';
      const box = $('#dialogbtns');
      box.innerHTML = '';
      (opts.buttons || []).forEach((b) => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'btn ' + (b.kind || '');
        el.textContent = b.label;
        el.addEventListener('click', () => {
          closeSheet(dialogSheet);
          const r = dialogResolve; dialogResolve = null;
          if (r) r(b.value);
        });
        box.appendChild(el);
      });
      openSheet(dialogSheet);
    });
  }
  function cancelDialog() {
    if (!dialogResolve) return false;
    const r = dialogResolve; dialogResolve = null;
    closeSheet(dialogSheet);
    r('cancel');
    return true;
  }
  /* ---------------- パスワード（4253 固定） ---------------- */
  let passResolve = null;
  function askPass(reason) {
    return new Promise((resolve) => {
      if (passResolve) { const p = passResolve; passResolve = null; p(false); }
      passResolve = resolve;
      $('#passhint').textContent = reason || 'パスワードを入力してください';
      $('#passinput').value = '';
      openSheet(passSheet);
      setTimeout(() => { try { $('#passinput').focus(); } catch (e) {} }, 240);
    });
  }
  function finishPass(result) {
    const r = passResolve; passResolve = null;
    closeSheet(passSheet);
    if (r) r(result);
  }
  function submitPass() {
    const v = $('#passinput').value.trim();
    if (v === PASS) { finishPass(true); return; }
    toast('パスワードが違います');
    $('#passinput').value = '';
    try { $('#passinput').focus(); } catch (e) {}
  }

  /* ---------------- フォーム ---------------- */
  function openForm(id) {
    editingId = id || null;
    const e = id ? items.get(id) : null;
    $('#formtitle').textContent = e ? '記録を編集' : '作品を追加';
    $('#formhint').textContent = e
      ? '内容を書き換えて保存してください。'
      : '4項目には当てはまらない評価点、言葉にできない点数を追加点として入力することができます。';
    $('#f_title').value = e ? e.title : '';
    FIELDS.forEach((f) => { $('#f_' + f.key).value = e ? e[f.key] : ''; });
    $('#f_total').value = e && e.total !== null ? e.total : '';
    $('#f_createdAt').value = e && e.createdAt ? e.createdAt : todayISO();
    $('#f_watch').value = e ? (parseNum(e.watchCount) || 1) : 1;
    $('#f_note').value = e ? e.note : '';
    $('#f_link').value = e ? e.link : '';
    syncCalcBtn();
    openSheet(formSheet);
    setTimeout(() => { try { $('#f_title').focus(); } catch (err) {} }, 240);
  }
  /* 合計欄の自動計算ボタン: 合計が入っているときは隠し、空のときだけ出す */
  function syncCalcBtn() {
    const has = $('#f_total').value.trim() !== '';
    $('#calcbtn').classList.toggle('hide', has);
  }
  function clearTotal() {
    $('#f_total').value = '';
    syncCalcBtn();
  }
  function calcTotal() {
    let sum = 0, any = false;
    FIELDS.forEach((f) => {
      const n = parseNum($('#f_' + f.key).value);
      if (n !== null) { sum += n; any = true; }
    });
    if (!any) { toast('点数が入っていません'); return; }
    const rounded = Math.round(sum * 100) / 100;
    $('#f_total').value = String(rounded);
    syncCalcBtn();
    toast('合計 ' + rounded + ' を入れました');
  }
  function collect() {
    const o = {
      title: $('#f_title').value.trim(),
      total: parseNum($('#f_total').value.trim()),
      createdAt: $('#f_createdAt').value || '',
      watchCount: parseNum($('#f_watch').value) || 1,
      note: $('#f_note').value.trim(),
      link: $('#f_link').value.trim()
    };
    FIELDS.forEach((f) => { o[f.key] = $('#f_' + f.key).value.trim(); });
    return o;
  }
  function applyTo(target, src) {
    target.title = src.title;
    FIELDS.forEach((f) => { target[f.key] = src[f.key]; });
    target.total = src.total;
    target.note = src.note;
    target.link = src.link;
    /* 作成日は入力された値をそのまま使う（空にしたら未設定のまま） */
    target.createdAt = src.createdAt;
    const w = parseNum(src.watchCount);
    target.watchCount = (w === null || w < 1) ? 1 : Math.floor(w);
    return target;
  }
  async function save() {
    const src = collect();
    if (!src.title) { toast('作品名を入力してください'); return; }
    if (src.total === null) { toast('合計点を入力してください'); return; }

    if (editingId) {
      const e = items.get(editingId);
      if (!e) { closeAllSheets(); return; }
      putEntry(applyTo(e, src));
      closeAllSheets();
      toast('更新しました');
      return;
    }
    const key = src.title.toLowerCase();
    const dup = all().filter((x) => String(x.title || '').trim().toLowerCase() === key);
    if (dup.length) {
      const target = dup.slice().sort((a, b) => (Number(b.order) || 0) - (Number(a.order) || 0))[0];
      const pick = await askChoice({
        title: '同じ作品名があります',
        msg: '「' + src.title + '」は既に登録されています（' + dup.length + '件）。\nどうしますか？\n\n・上書き — 登録済みの記録を今回の内容に置き換えます（作成日を今回の日付に更新し、視聴回数が1つ増えます）\n・新規作成 — 別の記録としてもう1件追加します',
        buttons: [
          { label: '上書きする', value: 'overwrite', kind: 'primary' },
          { label: '新規作成', value: 'new' },
          { label: 'やめる', value: 'cancel', kind: 'ghost' }
        ]
      });
      if (pick !== 'overwrite' && pick !== 'new') return;
      if (pick === 'overwrite') {
        const prevDate = target.createdAt || '';
        const prevWatch = parseNum(target.watchCount) || 1;
        applyTo(target, src);
        if (prevDate) target.prevDate = prevDate;
        target.watchCount = prevWatch + 1;
        target.order = nextOrder();
        putEntry(target);
        closeAllSheets();
        toast('「' + target.title + '」を上書きしました（' + target.watchCount + '周視聴）');
        return;
      }
    }
    putEntry(norm({
      id: uid(),
      title: src.title,
      char: src.char, scenario: src.scenario, art: src.art, tempo: src.tempo, other: src.other,
      total: src.total, note: src.note, link: src.link,
      createdAt: src.createdAt || todayISO(),
      prevDate: '',
      watchCount: src.watchCount,
      order: nextOrder()
    }));
    closeAllSheets();
    toast('追加しました');
  }

  /* ---------------- 書き出し / 読み込み ---------------- */
  function download(name, text, mime) {
    const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1200);
  }
  function stamp() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }
  function exportJson() {
    download('animemo-' + stamp() + '.json', JSON.stringify(all(), null, 2), 'application/json');
    toast('書き出しました');
  }
  function csvCell(v) {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function exportCsv() {
    const head = ['作品名', '作成日', '視聴回数', 'キャラ', 'シナリオ', '作画', 'テンポ', '追加点', '合計', '備考', '作品公式Twitter'];
    const rows = visibleEntries().map((e) => [
      e.title, e.createdAt ? fmtDate(e.createdAt) : '', watchText(e),
      e.char, e.scenario, e.art, e.tempo, e.other, e.total, e.note, e.link
    ]);
    download('animemo-' + stamp() + '.csv', '\uFEFF' + [head].concat(rows).map((r) => r.map(csvCell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
    toast('CSVを書き出しました');
  }
  function importJson(file) {
    const fr = new FileReader();
    fr.onload = async () => {
      let clean;
      try {
        const data = JSON.parse(String(fr.result));
        if (!Array.isArray(data)) throw new Error('形式が違います');
        clean = data.filter((x) => x && typeof x === 'object' && x.title).map((x) => norm(x));
      } catch (err) {
        toast('読み込めませんでした：' + (err && err.message ? err.message : '不明なエラー'));
        return;
      }
      if (!clean.length) { toast('読み込める記録がありません'); return; }
      const pick = await askChoice({
        title: 'バックアップを読み込みます',
        msg: clean.length + '件のデータです。どう読み込みますか？\n\n・追加する — 今の記録に足します\n・置き換える — 今の記録を消して、この内容にします',
        buttons: [
          { label: '追加する', value: 'merge', kind: 'primary' },
          { label: '置き換える', value: 'replace', kind: 'warn' },
          { label: 'やめる', value: 'cancel', kind: 'ghost' }
        ]
      });
      if (pick !== 'merge' && pick !== 'replace') return;
      if (pick === 'replace') {
        if (cloudMode && cloudRef) { try { await cloudRef.remove(); } catch (err) {} }
        items.clear();
      }
      let order = nextOrder();
      clean.forEach((e) => {
        if (items.has(e.id)) e.id = uid();
        e.order = order++;
        items.set(e.id, e);
      });
      cacheSave();
      if (cloudMode && cloudRef) {
        for (const e of clean) { try { await cloudRef.child(e.id).set(e); } catch (err) {} }
      }
      render();
      closeAllSheets();
      toast('読み込みました（' + clean.length + '件）');
    };
    fr.readAsText(file);
  }

  /* ---------------- イベント ---------------- */
  $('#addbtn').addEventListener('click', async () => {
    if (!(await askPass('記録を追加します。パスワードを入力してください'))) return;
    openForm(null);
  });
  $('#passok').addEventListener('click', submitPass);
  $('#passcancel').addEventListener('click', () => finishPass(false));
  $('#passinput').addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); submitPass(); }
  });
  $('#menubtn').addEventListener('click', () => openSheet(menuSheet));
  scrim.addEventListener('click', () => { if (!cancelDialog()) closeAllSheets(); });
  $('#cancelbtn').addEventListener('click', closeAllSheets);
  $('#menuclose').addEventListener('click', closeAllSheets);
  $('#savebtn').addEventListener('click', save);
  $('#calcbtn').addEventListener('click', calcTotal);
  FIELDS.forEach((f) => {
    $('#f_' + f.key).addEventListener('input', clearTotal);
  });
  $('#f_total').addEventListener('input', syncCalcBtn);
  $('#m_cloud').addEventListener('click', openCloudSheet);
  $('#c_cancel').addEventListener('click', closeAllSheets);
  $('#c_save').addEventListener('click', saveCloudFromSheet);
  $('#c_reset').addEventListener('click', clearSavedCloud);

  listEl.addEventListener('click', async (ev) => {
    const btn = ev.target.closest('[data-act]');
    if (!btn) return;
    const card = ev.target.closest('.card');
    if (!card) return;
    const id = card.getAttribute('data-id');
    const act = btn.getAttribute('data-act');
    if (act === 'toggle') {
      if (openIds.has(id)) openIds.delete(id); else openIds.add(id);
      render();
    } else if (act === 'edit') {
      if (!(await askPass('記録を編集します。パスワードを入力してください'))) return;
      openForm(id);
    } else if (act === 'copyopen') {
      const e = items.get(id);
      if (!e) return;
      if (copyOpen.has(id)) { copyOpen.delete(id); render(); return; }
      copyOpen.add(id);
      render();
      const ok = await copyString(copyText(e));
      selectCopyBox(id);
      toast(ok ? 'コピーしました' : '長押しして「コピー」を選んでください');
    } else if (act === 'copy') {
      const e = items.get(id);
      if (!e) return;
      const ok = await copyString(copyText(e));
      selectCopyBox(id);
      toast(ok ? 'コピーしました' : '長押しして「コピー」を選んでください');
    } else if (act === 'del') {
      if (!(await askPass('記録を削除します。パスワードを入力してください'))) return;
      const e = items.get(id);
      if (!e) return;
      askChoice({
        title: 'この記録を削除しますか？',
        msg: '「' + e.title + '」を削除します。取り消せません。',
        buttons: [
          { label: '削除する', value: 'yes', kind: 'warn' },
          { label: 'やめる', value: 'no', kind: 'ghost' }
        ]
      }).then((r) => {
        if (r !== 'yes') return;
        dropEntry(id);
        toast('削除しました');
      });
    }
  });

  searchEl.addEventListener('input', () => { query = searchEl.value; render(); });
  sortSel.addEventListener('change', () => { sortKey = sortSel.value; render(); });
  sortDirBtn.addEventListener('click', () => {
    sortAsc = !sortAsc;
    sortDirBtn.textContent = sortAsc ? '↑' : '↓';
    render();
  });

  $('#m_export').addEventListener('click', async () => {
    if (!(await askPass('バックアップを書き出します。パスワードを入力してください'))) return;
    exportJson();
  });
  $('#m_csv').addEventListener('click', exportCsv);
  const fileInput = $('#fileinput');
  $('#m_import').addEventListener('click', async () => {
    if (!(await askPass('バックアップを読み込みます。パスワードを入力してください'))) return;
    fileInput.click();
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files && fileInput.files[0]) importJson(fileInput.files[0]);
    fileInput.value = '';
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (cancelDialog()) return;
    closeAllSheets();
  });

  /* ---------------- 起動 ---------------- */
  loadLocal();
  render();
  setSync('local');
  initCloud();
})();

</script>
